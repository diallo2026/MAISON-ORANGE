        drawDoughnut('dash_sims', ['Attribuées','En stock','Autres'], simStats, ['#1F8A4C','#E8A200','#D92B2B'], 'SIM');
      const synthTypes = [
        {id:'ca', color:'#FF6600'}, {id:'om', color:'#1F8A4C'}, {id:'tdr', color:'#D92B2B'},
        {id:'tda', color:'#E8A200'}, {id:'lp', color:'#8E44AD'}
      ];
      synthTypes.forEach(s=>{
        const series = last14DaysSeries(s.id, null, 30);
        drawChart('synth_'+s.id, 'line', series.labels, series.data, s.color, typeLabel(s.id)+' ('+unitFor(s.id)+')');
      });
    };
  } else if(role==='superviseur'){
    const ymS = todayStr().slice(0,7);
    const mesAgents = agentsDe(SESSION.id);
    const myAgentsCount = mesAgents.length;
    const todayCA = DB.ca.filter(c=>isToday(c.date) && c.gerantId===SESSION.id);
    const todayMoves = DB.activityLog.filter(l=> isToday(l.ts) && mesAgents.some(a=>a.id===l.userId));
    statsHtml = cardsRow([
      ['Mes agents', myAgentsCount, 'objectif CA réparti : '+totalObjectifAgents(SESSION.id, ymS).toLocaleString('fr-FR')+' GNF'],
      ['Mes clients (PDV)', DB.clients.filter(c=>c.superviseurId===SESSION.id).length, 'créés par mes agents'],
      ["CA aujourd'hui", todayCA.reduce((a,c)=>a+Number(c.montant||0),0).toLocaleString('fr-FR')+' GNF', todayCA.length+' déclarations'],
      ['SIM déployées', DB.sims.filter(s=>s.deployedBy===SESSION.id).length, ''],
      ["Mouvements du jour", todayMoves.length, 'visibles jusqu\'à minuit'],
    ]);
    lockBanner = `<div class="lock-banner"><span class="banner-text">🔒 Accès limité au jour courant : les données d'hier et avant ne sont visibles que par le responsable de zone (rapports/justificatifs).</span>${dayArcSVG(38)}</div>`;
  } else if(role==='agent'){
    const mySims = DB.sims.filter(s=>s.agentId===SESSION.id);
    const ym = todayStr().slice(0,7);
    const objectif = getObjectifAgent(SESSION.id, ym);
    const objectifOM = getObjectifAgentOM(SESSION.id, ym);
    const tCommande = computeRealisationChamp(SESSION.id, ym, 'commande');
    const tVersement = computeRealisationChamp(SESSION.id, ym, 'versement');
    const tConversion = computeRealisationChamp(SESSION.id, ym, 'conversion');
    statsHtml = cardsRow([
      ['SIM en charge', mySims.filter(s=>s.statut==='attribuee').length, ''],
      ['Mes clients', DB.clients.filter(c=>c.agentId===SESSION.id).length, 'portefeuille'],
      ['Total commande — mois', tCommande.toLocaleString('fr-FR')+' GNF', objectif? 'Objectif CA : '+objectif.toLocaleString('fr-FR')+' GNF' : 'Aucun objectif défini'],
      ['Total versement — mois', tVersement.toLocaleString('fr-FR')+' GNF', objectifOM? 'Objectif OM : '+objectifOM.toLocaleString('fr-FR')+' GNF' : ''],
      ['Total conversion — mois', tConversion.toLocaleString('fr-FR')+' GNF', 'saisi par le responsable de zone'],
    ]);
    const rTrend = realisationSeries(SESSION.id, 14);
    extraHtml = `<div class="panel"><div class="panel-head"><h2>📈 Ma réalisation — 14 derniers jours</h2>
        <button class="btn btn-ghost btn-sm" onclick="navigate('realisation')">Déclarer ma réalisation →</button></div>
      <div class="panel-body"><div class="chart-wrap"><canvas id="dash_r_trend"></canvas></div></div></div>`;
    afterRender = ()=> drawChart('dash_r_trend','line', rTrend.labels, rTrend.data, '#8E44AD', 'Réalisation (GNF)');
  } else if(role==='secretaire'){
    const today = todayStr();
    const mine = DB.secAttendance.filter(e=>e.secretaireId===SESSION.id && e.date===today);
    statsHtml = cardsRow([
      ['Présences notées aujourd\'hui', mine.length, ''],
      ['Grossistes actifs', superviseursActifs().length, 'commerciaux indépendants'],
    ]);
    extraHtml = `<div class="panel"><div class="panel-head"><h2>Accès rapide</h2></div>
      <div class="panel-body"><button class="btn btn-primary btn-sm" onclick="navigate('secAttendance')">🔎 Rechercher un grossiste et noter sa présence</button></div></div>`;
  }

  main.innerHTML = `
    <div class="topbar">
      <div><h1>Tableau de bord</h1><p>Bienvenue, ${escapeHtml(SESSION.prenom)} ${escapeHtml(SESSION.nom)} — ${roleLabel(role)}</p></div>
    </div>
    ${lockBanner}
    ${statsHtml}
    ${extraHtml}
    <div class="panel">
      <div class="panel-head"><h2>Activité récente</h2></div>
      <div class="panel-body">${recentActivityTable()}</div>
    </div>
  `;
  afterRender();
}

function cardsRow(items){
  return `<div class="grid-cards">${items.map(([label,val,sub])=>`
    <div class="stat-card">
      <div class="stat-label">${label}</div>
      <div class="stat-value">${val}</div>
      ${sub?`<div class="stat-sub">${sub}</div>`:''}
    </div>`).join('')}</div>`;
}

function recentActivityTable(){
  let logs = [...DB.activityLog].sort((a,b)=> new Date(b.ts)-new Date(a.ts));
  if(SESSION.role==='superviseur'){
    // superviseur : uniquement logs du jour, de son équipe + lui-même
    const teamIds = DB.users.filter(u=>u.superviseurId===SESSION.id || u.createdBy===SESSION.id).map(u=>u.id).concat([SESSION.id]);
    logs = logs.filter(l=> isToday(l.ts) && teamIds.includes(l.userId));
  } else if(SESSION.role==='agent' || SESSION.role==='secretaire'){
    logs = logs.filter(l=> l.userId===SESSION.id);
  }
  logs = logs.slice(0,12);
  if(logs.length===0) return emptyState('Aucune activité','Les actions effectuées apparaîtront ici.');
  return `<table><thead><tr><th>Date</th><th>Utilisateur</th><th>Rôle</th><th>Action</th><th>Détail</th></tr></thead><tbody>
    ${logs.map(l=>`<tr><td class="mono">${fmtDate(l.ts)}</td><td>${escapeHtml(l.userNom)}</td><td><span class="badge badge-orange">${roleLabel(l.role)}</span></td><td>${escapeHtml(l.action)}</td><td class="muted">${escapeHtml(l.details)}</td></tr>`).join('')}
  </tbody></table>`;
}

function emptyState(title,sub){
  return `<div class="empty"><b>${title}</b>${sub}</div>`;
}

async function addCustomTheme(){
  const nom = document.getElementById('ct_nom').value.trim();
  if(!nom){ toast('Donnez un nom au thème'); return; }
  const c1 = document.getElementById('ct_side1').value;
  const c2 = document.getElementById('ct_side2').value;

  const tb = document.getElementById('ct_top').value;
  const tt = document.getElementById('ct_toptext').value;
  const theme = {
    id: 'custom-' + Math.random().toString(36).slice(2,8),
    nom,
    bg: `linear-gradient(180deg, ${c1}, ${c2})`,
    text: st,
    textSoft: softColor(st),
    activeBg: 'rgba(0,0,0,.25)',
    topBg: `linear-gradient(90deg, ${tb}, ${tb})`,
    topText: tt,
    topSub: softColor(tt),
    btn: document.getElementById('ct_btn').value,
    btnDark: shadeColor(document.getElementById('ct_btn').value, -0.25)
  };

/* ---------- RÉINITIALISATION DES DONNÉES DE TRAVAIL ----------
   Utile après une période d'essai : remet à zéro les compteurs et
   mouvements enregistrés par les agents/grossistes, sans supprimer les
   comptes ni les zones (qui se suppriment individuellement
   ailleurs dans Personnel / Zones). Réservé au responsable de
   zone, protégé par un mot de confirmation tapé manuellement. */
function settingsResetView(){
  if(SESSION.role!=='responsable_zone'){
    return `<div class="panel"><div class="panel-body">${emptyState('Accès réservé','Seul le responsable de zone peut réinitialiser les données.')}</div></div>`;
  }
  return `
    <div class="panel" style="border-color:#F0C9C9;">
      <div class="panel-head"><h2 style="color:var(--danger);">⚠ Réinitialiser les données de travail</h2></div>
      <div class="panel-body">
        <p class="muted" style="font-size:12.5px;margin:0 0 14px;line-height:1.6;">
          À utiliser si la base a servi pour un essai et que vous voulez repartir de zéro pour le vrai travail.
          Cette action remet à zéro les compteurs et mouvements cochés ci-dessous. Elle ne touche <b>ni les comptes du
          personnel, ni les zones</b> — pour les supprimer, utilisez les boutons 🗑 dans Personnel et Zones.
        </p>
        <div class="reset-check-list">
          <label class="reset-check"><input type="checkbox" id="rz_ca" checked> Déclarations CA, OM, TDR, TDA, LP</label>
          <label class="reset-check"><input type="checkbox" id="rz_obj" checked> Objectifs fixés (superviseurs, grossistes, agents et clients)</label>
          <label class="reset-check"><input type="checkbox" id="rz_real" checked> Réalisations des agents (journalières et mensuelles)</label>
          <label class="reset-check"><input type="checkbox" id="rz_pointages" checked> Pointages du personnel (présences)</label>
          <label class="reset-check"><input type="checkbox" id="rz_sims"> Historique des SIM (remet chaque SIM « en stock », sans titulaire)</label>
          <label class="reset-check"><input type="checkbox" id="rz_reports"> Rapports générés</label>
          <label class="reset-check"><input type="checkbox" id="rz_log"> Journal d'audit</label>
        </div>
        <div class="field" style="margin-top:16px;">
          <label>Pour confirmer, tapez <b>REINITIALISER</b> ci-dessous</label>
          <input type="text" id="rz_confirm_word" placeholder="REINITIALISER" autocomplete="off">
        </div>
        <button class="btn btn-danger" style="width:100%;margin-top:4px;" onclick="executeReset()">Réinitialiser les données sélectionnées</button>
      </div>
    </div>`;
}
async function executeReset(){
  const word = (document.getElementById('rz_confirm_word').value||'').trim().toUpperCase();
  if(word !== 'REINITIALISER'){ toast('Tapez exactement REINITIALISER pour confirmer'); return; }
  const doCA = document.getElementById('rz_ca').checked;
  const doObj = document.getElementById('rz_obj').checked;
  const doReal = document.getElementById('rz_real').checked;
  const doPt = document.getElementById('rz_pointages').checked;
  const doSims = document.getElementById('rz_sims').checked;
  const doReports = document.getElementById('rz_reports').checked;
  const doLog = document.getElementById('rz_log').checked;
  if(!doCA && !doObj && !doReal && !doPt && !doSims && !doReports && !doLog){ toast('Sélectionnez au moins un élément à réinitialiser'); return; }
  if(!confirm('Cette action est IRRÉVERSIBLE. Confirmez-vous la réinitialisation des données sélectionnées ?')) return;

  const resetParts = [];
  if(doCA){ DB.ca=[]; DB.om=[]; DB.tdr=[]; DB.tda=[]; DB.lp=[]; resetParts.push('déclarations CA/OM/TDR/TDA/LP'); }
  if(doObj){ DB.objectifs={}; DB.objectifsSup={}; DB.objectifsAgent={}; DB.objectifsAgentOM={}; DB.objectifsClient={}; DB.objectifsClientOM={}; resetParts.push('objectifs'); }
  if(doReal){ DB.realisations=[]; resetParts.push('réalisations des agents'); }
  if(doPt){ DB.pointages=[]; resetParts.push('pointages'); }
  if(doSims){ DB.sims.forEach(s=>{ s.statut='stock'; s.agentId=null; s.clientActuelId=null; s.history=[]; }); resetParts.push('historique des SIM'); }
  if(doReports){ DB.reports=[]; resetParts.push('rapports générés'); }
  if(doLog){ DB.activityLog=[]; resetParts.push("journal d'audit"); }

  logAction('Réinitialisation des données', resetParts.join(', '));
  await saveDB();
  toast('Réinitialisation effectuée : '+resetParts.join(', '));
  render();
}

function filterPersonnelSection(input, kind){
  const q = input.value.toLowerCase();
  const map = {sup:['superviseur','secSup'], ag:['agent','secAg']};
  const [role, wrapId] = map[kind];
  const list = DB.users.filter(u=>u.role===role && ((u.prenom+' '+u.nom+' '+u.code).toLowerCase().includes(q)));

function switchPersonnelTab(mode){

  const rz = DB.users.find(u=>u.role==='responsable_zone');

  const orphanAgents = DB.users.filter(u=>u.role==='agent' && !u.superviseurId);

  const branch = (sup)=>{
    const myAgents = agentsDe(sup.id);
    return `<div class="org-node org-sup">

          <div class="org-name">${escapeHtml(rz.prenom)} ${escapeHtml(rz.nom)}</div>
          <div class="org-role">Responsable de zone — ${rz.code}</div>

            <div class="org-children">${orphanAgents.map(a=>`<div class="org-card org-leaf org-agent" onclick="openUserProfile('${a.id}')">

function defaultAvatar(){
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80"><rect width="80" height="80" fill="#EFEBE4"/><circle cx="40" cy="30" r="14" fill="#C7C0B4"/><ellipse cx="40" cy="66" rx="24" ry="16" fill="#C7C0B4"/></svg>`);
}
function handlePhotoSelect(input, previewId){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => { document.getElementById(previewId).src = e.target.result; };
  reader.readAsDataURL(file);
}

function nextCode(prefix){
  const existing = DB.users.filter(u=>u.code.startsWith(prefix+'-')).map(u=>parseInt(u.code.split('-')[1])||0);
  const n = (existing.length? Math.max(...existing):0)+1;
  return prefix+'-'+String(n).padStart(4,'0');
}

async function saveNewUser(role){
  const prenom = document.getElementById('nu_prenom').value.trim();
  const nom = document.getElementById('nu_nom').value.trim();
  const tel = document.getElementById('nu_tel').value.trim();
  const code = document.getElementById('nu_code').value.trim();
  const pass = document.getElementById('nu_pass').value.trim();
  const modif = document.getElementById('nu_modif').checked;
  const suppr = document.getElementById('nu_suppr').checked;
  const pdvId = document.getElementById('nu_pdv')?.value || null;
  const numSTK = (document.getElementById('nu_stk')?.value || '').trim() || null;
  const emplacement = (document.getElementById('nu_emplacement')?.value || '').trim() || null;
  const coordGPS = (document.getElementById('nu_gps')?.value || '').trim() || null;
  const superviseurId = role==='agent'
    ? (SESSION.role==='superviseur' ? SESSION.id : (document.getElementById('nu_superviseur')?.value || null))
    : null;
  const photoEl = document.getElementById('nu_photo_preview');
  const photo = photoEl && photoEl.src.startsWith('data:image') && !photoEl.src.includes('svg+xml') ? photoEl.src : null;

  if(!prenom || !nom || !code || !pass){ toast('Veuillez remplir tous les champs obligatoires'); return; }
  if(DB.users.some(u=>u.code.toLowerCase()===code.toLowerCase())){ toast('Ce code existe déjà'); return; }

  const newUser = {
    id: uid(role.substring(0,2).toUpperCase()),
    role, code, pass, nom, prenom, tel, photo,
    codePointage: pass, /* le code de pointage suit toujours le mot de passe */
    numSTK: numSTK,
    emplacement: emplacement,
    coordGPS: coordGPS,
    pdvId: pdvId || null,
    superviseurId: superviseurId || null,
    createdAt: nowISO(), createdBy: SESSION.id, active:true,
    perms:{modifier:modif, supprimer:suppr}
  };
  DB.users.push(newUser);
  logAction('Création de compte', `${roleLabel(role)} ${prenom} ${nom} (${code}) créé`);
  await saveDB();
  closeModal();
  toast(`Compte créé : ${code} / ${pass}`);
  render();
}

async function saveEditUser(id){
  const u = DB.users.find(x=>x.id===id);
  if(!u) return;
  /* Le superviseur crée librement ses agents, mais ne peut les modifier que si
     le responsable de zone lui en a donné l'autorisation. */
  if(SESSION.role==='superviseur' && !peutModifierAgents()){
    toast("Modification non autorisée par le responsable de zone"); return;
  }
  const newCode = document.getElementById('eu_code').value.trim();
  if(DB.users.some(x=>x.id!==id && x.code.toLowerCase()===newCode.toLowerCase())){ toast('Ce code est déjà utilisé'); return; }
  u.prenom = document.getElementById('eu_prenom').value.trim();
  u.nom = document.getElementById('eu_nom').value.trim();
  u.tel = document.getElementById('eu_tel').value.trim();
  u.code = newCode;
  u.pass = document.getElementById('eu_pass').value.trim();
  u.codePointage = u.pass; /* le code de pointage suit automatiquement le nouveau mot de passe */
  const photoEl = document.getElementById('eu_photo_preview');
  if(photoEl) u.photo = photoEl.src.startsWith('data:image') && !photoEl.src.includes('svg+xml') ? photoEl.src : u.photo;
  const pdvSel = document.getElementById('eu_pdv');
  if(pdvSel) u.pdvId = pdvSel.value || null;
  const stkEl = document.getElementById('eu_stk');
  if(stkEl) u.numSTK = stkEl.value.trim() || null;
  const empEl = document.getElementById('eu_emplacement');
  if(empEl) u.emplacement = empEl.value.trim() || null;
  const gpsEl = document.getElementById('eu_gps');
  if(gpsEl) u.coordGPS = gpsEl.value.trim() || null;
  const supSel = document.getElementById('eu_superviseur');
  if(supSel) u.superviseurId = supSel.value || null;
  logAction('Modification de compte', `${u.code} mis à jour`);
  await saveDB();
  closeModal();
  toast('Compte mis à jour');
  render();
}

async function savePermUser(id){
  const u = DB.users.find(x=>x.id===id);
  const newModif = document.getElementById('pu_modif').checked;
  const newSuppr = document.getElementById('pu_suppr').checked;
  if(!u.permsHistory) u.permsHistory = [];
  if(newModif!==u.perms.modifier || newSuppr!==u.perms.supprimer){
    u.permsHistory.push({
      ts: nowISO(), by: SESSION.prenom+' '+SESSION.nom,
      before: {modifier:u.perms.modifier, supprimer:u.perms.supprimer},
      after: {modifier:newModif, supprimer:newSuppr}
    });
  }
  u.perms.modifier = newModif;
  u.perms.supprimer = newSuppr;
  logAction('Autorisations modifiées', `${u.code} : modif=${u.perms.modifier}, suppr=${u.perms.supprimer}`);
  await saveDB();
  closeModal();
  toast('Autorisations mises à jour');
  render();
}

async function deleteUser(id){
  const u = DB.users.find(x=>x.id===id);
  if(!u) return;
  if(u.role==='responsable_zone'){ toast('Impossible de supprimer le responsable de zone'); return; }
  if(SESSION.role==='superviseur' && !peutSupprimerAgents()){
    toast("Suppression non autorisée par le responsable de zone"); return;
  }
  if(!confirm(`Supprimer définitivement le compte de ${u.prenom} ${u.nom} (${u.code}) ?\nSes déclarations et son historique restent conservés.`)) return;
  DB.users = DB.users.filter(x=>x.id!==id);
  logAction('Suppression de compte', `${roleLabel(u.role)} ${u.prenom} ${u.nom} (${u.code})`);
  await saveDB();
  toast('Compte supprimé');
  render();
}

/* Remplit la liste des préfectures selon la région choisie. */
function onZoneRegionChange(prefSel, comSel){
  const region = document.getElementById('pdv_region').value;
  const sel = document.getElementById('pdv_prefecture');
  const list = prefecturesDe(region);
  sel.innerHTML = (list.length? '' : '<option value="">— aucune préfecture pré-chargée —</option>')
    + list.map(x=>`<option value="${x}" ${x===prefSel?'selected':''}>${x}</option>`).join('')
    + '<option value="__autre__">Autre…</option>';
  onZonePrefectureChange(comSel);
}
function onZonePrefectureChange(comSel){
  const region = document.getElementById('pdv_region').value;
  const sel = document.getElementById('pdv_prefecture');
  const autre = document.getElementById('pdv_prefecture_autre');
  autre.style.display = sel.value==='__autre__' ? 'block' : 'none';
  const prefecture = sel.value==='__autre__' ? '' : sel.value;
  const comSelEl = document.getElementById('pdv_commune');
  const list = prefecture ? communesDe(region, prefecture) : [];
  comSelEl.innerHTML = (list.length? '' : '<option value="">— à saisir —</option>')
    + list.map(x=>`<option value="${x}" ${x===comSel?'selected':''}>${x}</option>`).join('')
    + '<option value="__autre__">Autre…</option>';
  onZoneCommuneChange();
}
function onZoneCommuneChange(){
  const sel = document.getElementById('pdv_commune');
  document.getElementById('pdv_commune_autre').style.display = (sel.value==='__autre__' || sel.value==='') ? 'block' : 'none';
}
/* Lecture + contrôle de complétude du formulaire de zone. */
function lireFormZone(){
  const region = document.getElementById('pdv_region').value;
  const pSel = document.getElementById('pdv_prefecture').value;
  const prefecture = pSel==='__autre__' ? document.getElementById('pdv_prefecture_autre').value.trim() : pSel;
  const cSel = document.getElementById('pdv_commune').value;
  const commune = (cSel==='__autre__' || cSel==='') ? document.getElementById('pdv_commune_autre').value.trim() : cSel;
  const d = {
    nom: document.getElementById('pdv_nom').value.trim(),
    region, prefecture, commune,
    district: document.getElementById('pdv_district').value.trim(),
    quartier: document.getElementById('pdv_quartier').value.trim(),
    lieu: document.getElementById('pdv_lieu').value.trim(),
  };
  const manquants = [];
  if(!d.nom) manquants.push('le nom de la zone');
  if(!d.region) manquants.push('la région');
  if(!d.prefecture) manquants.push('la préfecture');
  if(!d.commune) manquants.push('la commune');
  if(!d.district) manquants.push('le district');
  if(!d.quartier) manquants.push('le quartier');
  if(manquants.length){ toast('Renseignez '+manquants.join(', ')); return null; }
  /* Toute localité saisie à la main enrichit la liste de référence. */
  if(pSel==='__autre__') ajouterPrefecture(region, d.prefecture);
  if(cSel==='__autre__' || cSel==='') ajouterCommune(region, d.prefecture, d.commune);
  return d;
}

/* Panneau de traçabilité d'un numéro STK : chaque client qui l'a détenu, sa
   date d'entrée, sa date de sortie (ou « en cours »), et qui le lui a remis. */
function tracePanelSim(s){
  const etapes = parcoursSim(s);
  return `<div class="panel"><div class="panel-head"><h2>Numéro STK ${escapeHtml(s.iccid)}
      ${s.statut==='attribuee'?'<span class="badge badge-ok" style="margin-left:8px;">Attribué</span>':'<span class="badge badge-warn" style="margin-left:8px;">En stock</span>'}</h2>
      <button class="btn btn-ghost btn-sm export-btn" onclick="imprimerParcoursSim('${s.id}')">🖨 Imprimer PDF A4</button>
    </div>
    <div class="panel-body">
      ${etapes.length===0 ? emptyState('Aucun mouvement enregistré','—') : `
      <table><thead><tr><th>Client</th><th>Date d'entrée</th><th>Date de sortie</th><th>Remis par</th><th>Motif de sortie</th></tr></thead><tbody>
      ${etapes.slice().reverse().map(e=>`<tr>
        <td>${escapeHtml(e.clientNom||'—')}</td>
        <td class="mono">${fmtDate(e.dateEntree)}</td>
        <td class="mono">${e.dateSortie? fmtDate(e.dateSortie) : '<span class="badge badge-ok">En cours</span>'}</td>
        <td class="muted">${escapeHtml(e.remisPar||'—')}</td>
        <td class="muted">${escapeHtml(e.motifSortie||'—')}</td>
      </tr>`).join('')}
      </tbody></table>`}
    </div></div>`;
}
/* Impression PDF A4 (papier à en-tête) du parcours complet d'un numéro STK :
   chaque client, date d'entrée, date de sortie, et qui a remis le numéro. */
function imprimerParcoursSim(simId){
  const s = DB.sims.find(x=>x.id===simId);
  if(!s) return;
  const etapes = parcoursSim(s);
  const rows = etapes.map(e=>[
    e.clientNom||'—',
    fmtDate(e.dateEntree),
    e.dateSortie? fmtDate(e.dateSortie) : 'En cours',
    e.remisPar||'—',
    e.motifSortie||'—'
  ]);
  exportToPDF(
    `Traçabilité — numéro STK ${s.iccid}`,
    `Historique complet des clients ayant détenu ce numéro`,
    ['Client','Date d\'entrée','Date de sortie','Remis par','Motif de sortie'],
    rows
  );
  logAction('Traçabilité imprimée', s.iccid);
}

async function saveRealisation(){
  const date = todayStr();
  const commande = Number(document.getElementById('rl_commande').value || 0);
  const versement = Number(document.getElementById('rl_versement').value || 0);
  const pdvId = document.getElementById('rl_pdv').value || null;
  const notes = document.getElementById('rl_notes').value.trim();
  if(!commande && !versement){ toast('Indiquez au moins un montant'); return; }
  if(getRealisationMensuelle(SESSION.id, monthKey(date))){ toast('Ce mois a été saisi globalement par votre supérieur'); return; }
  const existing = getRealisationJour(SESSION.id, date);
  if(existing){
    if(!confirm('Une déclaration existe déjà pour ce jour. La remplacer ?')) return;
    existing.commande = commande; existing.versement = versement;
    existing.pdvId = pdvId; existing.notes = notes; existing.majLe = nowISO();
  } else {
    DB.realisations.push({ id: uid('RL'), agentId: SESSION.id, superviseurId: SESSION.superviseurId||null, date,
      commande, versement, conversion:0, pdvId, notes, type:'journalier', source:'agent', saisiPar:SESSION.id, saisiLe: nowISO() });
  }
  logAction('Réalisation déclarée', `commande ${commande} / versement ${versement} le ${date}`);
  await saveDB();
  closeModal(); toast('Réalisation enregistrée — ajoutée à votre total du mois'); render();
}
async function deleteRealisation(id){
  if(!confirm('Supprimer cette déclaration de réalisation ?')) return;
  DB.realisations = DB.realisations.filter(r=>r.id!==id);
  logAction('Réalisation supprimée', id);
  await saveDB();
  toast('Déclaration supprimée'); render();
}

/* Saisie / mise à jour de la réalisation journalière d'un agent. Une seule
   entrée par agent et par jour : on met à jour celle qui existe. */
async function saveRealisationJour(agentId){
  const jour = window._acDate || todayStr();
  const ym = monthKey(jour);
  if(getRealisationMensuelle(agentId, ym)){ toast('Réalisation mensuelle saisie : annulez-la d\'abord'); return; }
  const lire = id => { const el = document.getElementById(id); return el && el.value !== '' ? Number(el.value) : null; };
  const commande = lire('rj_cmd_'+agentId);
  const versement = lire('rj_vers_'+agentId);
  const conversionSaisie = SESSION.role==='responsable_zone' ? lire('rj_conv_'+agentId) : null;
  const agent = DB.users.find(u=>u.id===agentId);
  const existing = getRealisationJour(agentId, jour);
  const conversion = conversionSaisie !== null ? conversionSaisie : (existing? Number(existing.conversion||0) : 0);
  if(!commande && !versement && !conversion){
    if(existing){
      DB.realisations = DB.realisations.filter(r=>r.id!==existing.id);
      logAction('Réalisation journalière supprimée', `${agent?agent.prenom+' '+agent.nom:agentId} — ${jour}`);
      await saveDB(); toast('Réalisation du jour retirée'); render();
    }
    return;
  }
  if(existing){
    existing.commande = Number(commande||0);
    existing.versement = Number(versement||0);
    existing.conversion = Number(conversion||0);
    existing.majPar = SESSION.id; existing.majLe = nowISO();
  } else {
    DB.realisations.push({
      id: uid('RL'), agentId, superviseurId: agent? (agent.superviseurId||null) : null,
      date: jour, commande:Number(commande||0), versement:Number(versement||0), conversion:Number(conversion||0),
      pdvId: agent? (agent.pdvId||null) : null,
      type:'journalier', source: SESSION.role, notes:'',
      saisiPar: SESSION.id, saisiLe: nowISO()
    });
  }
  logAction('Réalisation journalière saisie', `${agent?agent.prenom+' '+agent.nom:agentId} — ${jour}`);
  await saveDB();
  toast('Réalisation du jour enregistrée — ajoutée au total du mois');
  render();
}

async function saveRealisationMois(agentId){
  const ym = todayStr().slice(0,7);
  const a = DB.users.find(u=>u.id===agentId);
  const m = getRealisationMensuelle(agentId, ym);
  const commande = Number(document.getElementById('rm_commande').value || 0);
  const versement = Number(document.getElementById('rm_versement').value || 0);
  const convEl = document.getElementById('rm_conversion');
  const conversion = SESSION.role==='responsable_zone'
    ? Number(convEl.value || 0)
    : (m? Number(m.conversion||0) : 0);
  const nbZones = Number(document.getElementById('rm_nbzones').value || 0);
  const notes = document.getElementById('rm_notes').value.trim();
  if(!commande && !versement && !conversion){ toast('Indiquez au moins un montant'); return; }
  const journalieres = realisationsMois(agentId, ym).filter(r=>r.type!=='mensuel');
  if(journalieres.length && !confirm(`${journalieres.length} réalisation(s) journalière(s) de ce mois seront supprimées et remplacées par les montants mensuels. Continuer ?`)) return;
  const jourIds = journalieres.map(r=>r.id);
  DB.realisations = DB.realisations.filter(r=> !jourIds.includes(r.id));
  const existing = getRealisationMensuelle(agentId, ym);
  if(existing){
    existing.commande = commande; existing.versement = versement; existing.conversion = conversion;
    existing.nbZones = nbZones; existing.notes = notes;
    existing.majPar = SESSION.id; existing.majLe = nowISO();
  } else {
    DB.realisations.push({
      id: uid('RM'), agentId, superviseurId: a? (a.superviseurId||null) : null,
      date: ym+'-01', commande, versement, conversion, pdvId: a? (a.pdvId||null) : null, nbZones,
      type:'mensuel', source: SESSION.role, notes,
      saisiPar: SESSION.id, saisiLe: nowISO()
    });
  }
  logAction('Réalisation mensuelle saisie', `${a?a.prenom+' '+a.nom:agentId} — ${ym} (${jourIds.length} saisie(s) journalière(s) supprimée(s))`);
  await saveDB();
  closeModal();
  toast('Réalisation mensuelle enregistrée — les saisies journalières du mois ont été supprimées');
  render();
}
async function annulerRealisationMois(agentId){
  const ym = todayStr().slice(0,7);

  if(!confirm('Supprimer la réalisation mensuelle et revenir à la saisie journalière ?')) return;
  DB.realisations = DB.realisations.filter(r=>r.id!==m.id);

async function saveEditClient(id){
  const c = DB.clients.find(x=>x.id===id);
  if(!c) return;
  const d = lireFormClient('ec');
  if(!d.prenom || !d.nom){ toast('Prénom et nom requis'); return; }
  const ancienSTK = c.numSTK;
  Object.assign(c, d);
  const ag = DB.users.find(u=>u.id===c.agentId);
  if(ag) c.superviseurId = ag.superviseurId || c.superviseurId;
  /* Si le numéro STK a changé, on ferme le fil de traçabilité de l'ancien
     numéro et on ouvre (ou reprend) celui du nouveau. */
  if(d.numSTK !== ancienSTK){
    if(ancienSTK){ const ancienSim = getSimByIccid(ancienSTK); if(ancienSim && ancienSim.clientId===c.id) retirerSimDuClient(ancienSim, 'Numéro remplacé pour ce client'); }
    if(d.numSTK) attribuerSimAuClient(d.numSTK, c, 'Numéro attribué à ce client');
  } else if(d.numSTK){
    /* Le numéro reste le même : on garde les informations de zone/agent du
       client synchronisées sur l'enregistrement de la SIM. */
    const sim = getSimByIccid(d.numSTK);
    if(sim && sim.clientId===c.id){ sim.pdvId = c.pdvId||null; sim.agentId = c.agentId||null; }
  }
  logAction('Client modifié', c.prenom+' '+c.nom);
  await saveDB();
  closeModal(); toast('Client mis à jour'); render();
}

/* =========================================================================
   SIMS — le numéro STK d'un client EST son numéro de SIM. Chaque numéro STK
   suit un fil de traçabilité unique (DB.sims, indexé par iccid = numéro STK),
   qui évolue automatiquement quand un client change de numéro ou qu'un
   numéro est redéployé vers un autre client.
   ========================================================================= */
function getSimByIccid(iccid){ return iccid ? DB.sims.find(s=>s.iccid===iccid) : null; }
/* Retire un numéro du client qui le détient actuellement. */
function retirerSimDuClient(sim, motif){
  if(!sim || sim.statut!=='attribuee') return;
  const ancienClient = DB.clients.find(c=>c.id===sim.clientId);
  sim.history.push({ event:'Retrait', ts: nowISO(), by: SESSION.id, byNom: SESSION.prenom+' '+SESSION.nom,
    clientId: sim.clientId, clientNom: ancienClient? ancienClient.prenom+' '+ancienClient.nom : '—',
    motif: motif || 'Non précisé' });
  sim.statut = 'stock';
  sim.clientId = null;
}
/* Attribue (ou crée puis attribue) un numéro STK à un client. Si le numéro
   est déjà détenu par un autre client, celui-ci est automatiquement retiré. */
function attribuerSimAuClient(iccid, client, motif){
  if(!iccid || !client) return;
  let sim = getSimByIccid(iccid);
  if(sim && sim.clientId && sim.clientId!==client.id) retirerSimDuClient(sim, motif || 'Numéro redéployé vers un autre client');
  if(!sim){
    sim = { id: uid('SIM'), iccid, statut:'stock', clientId:null, pdvId:null, agentId:null,
      createdAt: nowISO(), createdBy: SESSION.id, history: [] };
    DB.sims.push(sim);
  }
  sim.statut = 'attribuee';
  sim.clientId = client.id;
  sim.pdvId = client.pdvId || null;
  sim.agentId = client.agentId || null;
  sim.history.push({ event:'Attribution', ts: nowISO(), by: SESSION.id, byNom: SESSION.prenom+' '+SESSION.nom,
    clientId: client.id, clientNom: client.prenom+' '+client.nom, motif: motif || 'Nouvelle attribution' });
}
/* Reconstitue le parcours complet d'un numéro STK : chaque client qui l'a
   détenu, la date d'entrée, la date de sortie (ou « en cours »), et qui a
   remis le numéro à ce client-là. */
function parcoursSim(sim){
  if(!sim) return [];
  const hist = (sim.history||[]).slice().sort((a,b)=> new Date(a.ts)-new Date(b.ts));
  const etapes = [];
  let ouvert = null;
  hist.forEach(h=>{
    if(h.event==='Attribution'){
      if(ouvert) etapes.push(Object.assign({}, ouvert, {dateSortie: h.ts, motifSortie:'Redéployé vers un autre client'}));
      ouvert = { clientNom: h.clientNom, dateEntree: h.ts, remisPar: h.byNom };
    } else if(h.event==='Retrait'){
      if(ouvert){ etapes.push(Object.assign({}, ouvert, {dateSortie: h.ts, motifSortie: h.motif||'—'})); ouvert = null; }
    }
  });
  if(ouvert) etapes.push(Object.assign({}, ouvert, {dateSortie:null, motifSortie:null}));
  return etapes;
}
/* =========================================================================
   ALERTES SIM (ancien module, conservé)
   ========================================================================= */
/* ---------- ALERTES SIM ----------
   - Stock dormant : SIM en stock depuis plus de 15 jours sans attribution
   - Mouvements suspects : SIM ayant subi 3 retraits ou plus (rotation anormale) */
function simAlerts(){
  const alerts = [];
  const now = new Date();
  DB.sims.forEach(s=>{
    if(s.statut==='stock'){
      const lastEvent = s.history[s.history.length-1];
      const days = lastEvent ? Math.floor((now - new Date(lastEvent.ts))/86400000) : 0;
      if(days >= 15) alerts.push({sim:s, type:'dormant', detail:`En stock depuis ${days} jours sans attribution`});
    }
    const retraits = s.history.filter(h=>h.event==='Retrait').length;
    if(retraits >= 3) alerts.push({sim:s, type:'rotation', detail:`${retraits} retraits enregistrés — rotation anormale`});
  });
  return alerts;
}

  list = list.filter(s=>{
    const agent = DB.users.find(u=>u.id===s.agentId);
    const client = DB.clients.find(c=>c.id===s.clientId);
    const hay = [s.iccid, client?client.prenom+' '+client.nom:'', agent?agent.prenom+' '+agent.nom:''].join(' ').toLowerCase();
    if(q && !hay.includes(q)) return false;
    if(statusF && s.statut!==statusF) return false;
    return true;
  });

}

async function saveRedeploySim(simId){
  const s = DB.sims.find(x=>x.id===simId);
  if(!s) return;
  const mode = document.querySelector('input[name="rdMode"]:checked').value;
  const motif = document.getElementById('rd_motif').value.trim() || 'Redéploiement';
  let client;
  if(mode==='existant'){
    const clientId = document.getElementById('rd_client').value;
    if(!clientId){ toast('Sélectionnez un client'); return; }
    client = DB.clients.find(c=>c.id===clientId);
    const ancienSTK = client.numSTK;
    client.numSTK = s.iccid;
    if(ancienSTK && ancienSTK!==s.iccid){ const ancienSim = getSimByIccid(ancienSTK); if(ancienSim && ancienSim.clientId===client.id) retirerSimDuClient(ancienSim, 'Remplacé par un nouveau numéro'); }
  } else {
    const d = lireFormClient('rd_new');
    if(!d.prenom || !d.nom){ toast('Prénom et nom du nouveau client requis'); return; }
    const ag = DB.users.find(u=>u.id===d.agentId);
    const superviseurId = SESSION.role==='agent' ? (SESSION.superviseurId||null)
      : (SESSION.role==='superviseur' ? SESSION.id : (ag? ag.superviseurId||null : null));
    client = Object.assign({ id: uid('CL'), superviseurId, createdAt: nowISO(),
      createdBy: SESSION.id, createdByRole: SESSION.role, active:true }, d, { numSTK: s.iccid });
    DB.clients.push(client);
  }
  attribuerSimAuClient(s.iccid, client, motif);
  logAction('Numéro STK redéployé', `${s.iccid} → ${client.prenom+' '+client.nom}`);
  await saveDB();
  closeModal(); toast('Numéro redéployé vers le nouveau client'); render();
}

    afterRender = ()=> { if(!dist.data.every(v=>v===0)) drawChart(`chart_${type}_dist`,'bar', dist.labels, dist.data, '#D14E00', `${typeLabel(type)} du jour`); };
  } else if(role==='responsable_zone'){
    const gerantIds = tousSuperviseurs().map(g=>g.id);
    const trend = last14DaysSeries(type, null);
    const dist = totalsByGerant(type, gerantIds, null);
    chartsHtml = `<div class="grid-2">
      <div class="panel"><div class="panel-head"><h2>Tendance — 14 derniers jours</h2></div>
        <div class="panel-body"><div class="chart-wrap"><canvas id="chart_${type}_trend"></canvas></div></div></div>
      <div class="panel"><div class="panel-head"><h2>Total par superviseur</h2>
        <button class="btn btn-ghost btn-sm" onclick="navigate('objectifs')">🎯 Objectifs</button></div>
        <div class="panel-body"><div class="chart-wrap">${dist.data.length===0?emptyState('Aucun superviseur','—'):'<canvas id="chart_'+type+'_dist"></canvas>'}</div></div></div>
    </div>`;
    afterRender = ()=>{
      drawChart(`chart_${type}_trend`,'line', trend.labels, trend.data, '#FF6600', `${typeLabel(type)} (${unitFor(type)})`);
      if(dist.data.length) drawChart(`chart_${type}_dist`,'bar', dist.labels, dist.data, '#7A2E00', `Total ${typeLabel(type)}`);
    };
  }

  main.innerHTML = `
    <div class="topbar"><div><h1>${title}</h1><p>${sub}</p></div>
      <div class="panel-actions">
        ${(role==='superviseur'||role==='responsable_zone')?`<button class="btn btn-primary btn-sm" onclick="openDeclare('${type}')">+ Déclarer</button>`:''}
        ${role==='responsable_zone'?`<button class="btn btn-ghost btn-sm export-btn" onclick="exportMoveExcel('${type}','${title}')">⬇ Excel</button>`:''}
      </div>
    </div>
    ${lockBanner}
    ${chartsHtml}
    <div class="panel"><div class="panel-body">${moveTable(list,type)}</div></div>
  `;
  afterRender();
}
function exportMoveExcel(type, title){
  const colLabel = type==='ca' ? 'Montant (GNF)' : type==='lp' ? 'Présences' : 'Taux (%)';
  const rows = [['Date','Superviseur','Rattachement',colLabel,'Référence','Notes']];
  DB[type].forEach(e=>{
    const gerant = getSuperviseur(e.gerantId);
    const sup = DB.users.find(u=>u.id===e.superviseurId);
    rows.push([e.date, gerant?gerant.prenom+' '+gerant.nom:'—', sup?sup.prenom+' '+sup.nom:'—', e.montant, e.ref, e.notes]);
  });
  exportToExcel(rows, `${type}-maison-orange`, title);
}

function moveTable(list, type){
  if(list.length===0) return emptyState('Aucune donnée','Aucune déclaration enregistrée pour le moment.');
  list = [...list].sort((a,b)=> new Date(b.date)-new Date(a.date));
  const colLabel = type==='ca' ? 'Montant' : type==='lp' ? 'Présences' : 'Taux';
  return `<table><thead><tr><th>Date</th><th>Superviseur</th><th>Rattachement</th><th>${colLabel}</th><th>Référence</th><th>Notes</th>${SESSION.role==='responsable_zone'?'<th></th>':''}</tr></thead><tbody>
  ${list.map(e=>{
    const gerant = getSuperviseur(e.gerantId);
    const sup = DB.users.find(u=>u.id===e.superviseurId);
    return `<tr>
      <td class="mono">${e.date}</td>
      <td>${gerant? gerant.prenom+' '+gerant.nom:'—'}</td>
      <td class="muted">${sup? sup.prenom+' '+sup.nom:'—'}</td>
      <td><b>${Number(e.montant||0).toLocaleString('fr-FR')} ${unitFor(type)}</b></td>
      <td class="mono muted">${escapeHtml(e.ref||'—')}</td>
      <td class="muted">${escapeHtml(e.notes||'')}</td>
      ${SESSION.role==='responsable_zone'?`<td><button class="btn btn-ghost btn-sm" onclick="deleteEntry('${type}','${e.id}')">Suppr.</button></td>`:''}
    </tr>`;
  }).join('')}</tbody></table>`;
}

function openDeclare(type){
  const fieldLabel = {
    ca: 'Montant du CA (GNF)',
    tdr: 'Taux de rupture (%)',
    tda: 'Taux d\'inactivité (%)',
    lp: 'Nombre de présences'
  }[type];
  /* Les grossistes n'ayant plus de compte, la déclaration est saisie pour leur
     compte par le superviseur qui les suit, ou par le responsable de zone. */
  const scope = SESSION.role==='responsable_zone' ? superviseursActifs() : [SESSION];
  if(scope.length===0){
    document.getElementById('modalTitle').textContent = `Déclarer — ${typeFullLabel(type)}`;
    document.getElementById('modalBody').innerHTML = emptyState('Aucun superviseur','Créez d\'abord un superviseur dans « Superviseurs & agents ».');
    document.getElementById('modalFoot').innerHTML = `<button class="btn btn-ghost btn-sm" onclick="closeModal()">Fermer</button>`;
    openModal(); return;
  }
  document.getElementById('modalTitle').textContent = `Déclarer — ${typeFullLabel(type)}`;
  document.getElementById('modalBody').innerHTML = `
    <div class="field"><label>Superviseur</label><select id="dc_gerant" ${scope.length===1?'disabled':''}>${scope.map(g=>`<option value="${g.id}">${escapeHtml(g.prenom+' '+g.nom)}</option>`).join('')}</select></div>
    <div class="field"><label>Date</label><input type="date" id="dc_date" value="${todayStr()}" max="${todayStr()}"></div>
    <div class="field"><label>${fieldLabel}</label><input type="number" id="dc_montant" placeholder="0"></div>
    <div class="field"><label>Référence</label><input type="text" id="dc_ref" placeholder="N° reçu, transaction…"></div>
    <div class="field"><label>Notes</label><textarea id="dc_notes" rows="2"></textarea></div>
  `;
  document.getElementById('modalFoot').innerHTML = `
    <button class="btn btn-ghost btn-sm" onclick="closeModal()">Annuler</button>
    <button class="btn btn-primary btn-sm" onclick="saveDeclare('${type}')">Enregistrer</button>`;
  openModal();
}
async function saveDeclare(type){
  const gerantId = SESSION.role==='superviseur' ? SESSION.id : document.getElementById('dc_gerant').value;
  const date = document.getElementById('dc_date').value || todayStr();
  const montant = document.getElementById('dc_montant').value;
  const ref = document.getElementById('dc_ref').value.trim();
  const notes = document.getElementById('dc_notes').value.trim();
  if(!gerantId){ toast('Sélectionnez le superviseur concerné'); return; }
  if(!montant){ toast('Indiquez le montant'); return; }
  const g = getSuperviseur(gerantId);
  /* L'activité est portée par le superviseur lui-même. */
  const supervisorId = gerantId;
  DB[type].push({ id: uid(type.toUpperCase()), gerantId, superviseurId: supervisorId, date, montant, ref, notes, saisiPar: SESSION.id });
  logAction(`Déclaration ${type.toUpperCase()}`, `${g?g.prenom+' '+g.nom:gerantId} — ${montant} le ${date}`);
  await saveDB();
  closeModal(); toast('Déclaration enregistrée'); render();
}
async function deleteEntry(type,id){
  DB[type] = DB[type].filter(e=>e.id!==id);
  logAction(`Suppression ${type.toUpperCase()}`, id);
  await saveDB();
  toast('Entrée supprimée'); render();
}

function renderDaily(){
  const main = document.getElementById('mainContent');

  if(role==='superviseur'){
    const mesIds = [SESSION.id, ...agentsDe(SESSION.id).map(a=>a.id)];

    main.innerHTML = `
      <div class="topbar"><div><h1>Mouvements de mon équipe — aujourd'hui</h1><p>Suivi journalier uniquement. L'historique bascule au responsable de zone après la journée.</p></div></div>
      <div class="lock-banner"><span class="banner-text">🔒 Cette vue se réinitialise chaque jour à minuit.</span>${dayArcSVG(38)}</div>
      <div class="panel"><div class="panel-body">${logTable(logs)}</div></div>
    `;
    return;
  }

  // Responsable de zone : filtre journalier + mensuel
  main.innerHTML = `
    <div class="topbar"><div><h1>Activité journalière des grossistes</h1><p>Vue complète : jour, mois, ou historique intégral — à des fins de rapport et de vérification.</p></div></div>
    <div class="tabgroup">
      <div class="tabgroup-head"><h3>Filtrer la période</h3></div>
      <div class="tabgroup-body">
        <div class="tabs">
          <button class="tab-btn active" data-tab="day" onclick="switchDailyTab('day')">Aujourd'hui</button>
          <button class="tab-btn" data-tab="month" onclick="switchDailyTab('month')">Ce mois</button>
          <button class="tab-btn" data-tab="all" onclick="switchDailyTab('all')">Historique complet</button>
        </div>
        <div class="panel"><div class="panel-body" id="dailyTableWrap">${logTable(dailyFiltered('day'))}</div></div>
      </div>
    </div>
  `;
}
function dailyFiltered(mode){
  const gerantIds = tousSuperviseurs().map(g=>g.id);
  let logs = DB.activityLog.filter(l=> gerantIds.includes(l.userId));
  if(mode==='day') logs = logs.filter(l=>isToday(l.ts));
  if(mode==='month'){
    const ym = todayStr().slice(0,7);
    logs = logs.filter(l=>l.ts.slice(0,7)===ym);
  }
  return logs;
}
function switchDailyTab(mode){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===mode));
  document.getElementById('dailyTableWrap').innerHTML = logTable(dailyFiltered(mode));
}
function logTable(logs){
  logs = [...logs].sort((a,b)=> new Date(b.ts)-new Date(a.ts));
  if(logs.length===0) return emptyState('Aucun mouvement','Rien à afficher pour cette période.');
  return `<table><thead><tr><th>Date/heure</th><th>Grossiste</th><th>Action</th><th>Détail</th></tr></thead><tbody>
  ${logs.map(l=>`<tr><td class="mono">${fmtDate(l.ts)}</td><td>${escapeHtml(l.userNom)}</td><td>${escapeHtml(l.action)}</td><td class="muted">${escapeHtml(l.details)}</td></tr>`).join('')}
  </tbody></table>`;
}

function switchReportsTab(mode){
  document.querySelectorAll('[data-rtab]').forEach(b=>b.classList.toggle('active', b.dataset.rtab===mode));
  const wrap = document.getElementById('reportsTabWrap');
  if(mode==='liste'){
    wrap.innerHTML = `<div class="panel"><div class="panel-head"><h2>Rapports générés</h2></div>
      <div class="panel-body" id="reportsListWrap">${reportsList()}</div></div>`;
  } else {
    wrap.innerHTML = comparePeriodsView();
  }
}
function allPeriodOptions(){
  const y = new Date().getFullYear();
  let opts = '';
  for(let yr=y; yr>=y-3; yr--){
    ['Q1','Q2','Q3','Q4'].forEach(q=> opts += `<option value="${q}-${yr}">${periodeLabel(q+'-'+yr)}</option>`);
    opts += `<option value="Y-${yr}">${periodeLabel('Y-'+yr)}</option>`;
  }
  return opts;
}
function comparePeriodsView(){
  return `<div class="panel"><div class="panel-head"><h2>Comparer deux périodes</h2></div>
    <div class="panel-body">
      <div class="grid-2">
        <div class="field"><label>Période A</label><select id="cmp_a" onchange="runComparison()">${allPeriodOptions()}</select></div>
        <div class="field"><label>Période B</label><select id="cmp_b" onchange="runComparison()">${allPeriodOptions()}</select></div>
      </div>
      <div id="cmpResult"></div>
    </div>
  </div>`;
}
function deltaHtml(a,b,unit){
  if(a===0 && b===0) return '<span class="muted">—</span>';
  const diff = b-a;
  const pct = a!==0 ? Math.round((diff/a)*100) : (b>0?100:0);
  const cls = diff>=0 ? 'delta-up' : 'delta-down';
  const arrow = diff>=0 ? '▲' : '▼';
  return `<span class="${cls}">${arrow} ${Math.abs(pct)}%</span>`;
}
function runComparison(){
  const pa = document.getElementById('cmp_a').value;
  const pb = document.getElementById('cmp_b').value;
  const sa = computeStatsForPeriod(pa);
  const sb = computeStatsForPeriod(pb);
  document.getElementById('cmpResult').innerHTML = `
    <table style="margin-top:10px;">
      <thead><tr><th>Indicateur</th><th>${periodeLabel(pa)}</th><th>${periodeLabel(pb)}</th><th>Évolution</th></tr></thead>
      <tbody>
        <tr><td>CA total</td><td><b>${sa.caTotal.toLocaleString('fr-FR')} GNF</b></td><td><b>${sb.caTotal.toLocaleString('fr-FR')} GNF</b></td><td>${deltaHtml(sa.caTotal,sb.caTotal)}</td></tr>
        <tr><td>TDR (déclarations)</td><td>${sa.tdrTotal}</td><td>${sb.tdrTotal}</td><td>${deltaHtml(sa.tdrTotal,sb.tdrTotal)}</td></tr>
        <tr><td>TDA (déclarations)</td><td>${sa.tdaTotal}</td><td>${sb.tdaTotal}</td><td>${deltaHtml(sa.tdaTotal,sb.tdaTotal)}</td></tr>
        <tr><td>LP (présences)</td><td>${sa.lpTotal.toLocaleString('fr-FR')}</td><td>${sb.lpTotal.toLocaleString('fr-FR')}</td><td>${deltaHtml(sa.lpTotal,sb.lpTotal)}</td></tr>
      </tbody>
    </table>
    <div class="chart-wrap" style="margin-top:16px;"><canvas id="chart_cmp"></canvas></div>
  `;
  destroyChart('chart_cmp');
  new Chart(document.getElementById('chart_cmp'), {
    type:'bar',
    data:{ labels:['TDR','TDA','LP (÷100)'], datasets:[
      { label: periodeLabel(pa), data:[sa.tdrTotal, sa.tdaTotal, Math.round(sa.lpTotal/100)], backgroundColor:'#FF6600CC', borderRadius:4 },
      { label: periodeLabel(pb), data:[sb.tdrTotal, sb.tdaTotal, Math.round(sb.lpTotal/100)], backgroundColor:'#1B1B1FCC', borderRadius:4 },
    ]},
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:true, position:'bottom'}}, scales:{ y:{beginAtZero:true, grid:{color:'#EEE9E2'}}, x:{grid:{display:false}} } }
  });
}
function reportPeriodOptions(){
  const y = new Date().getFullYear();
  let opts = '';
  for(let yr=y; yr>=y-3; yr--){
    for(let m=12; m>=1; m--){
      const mm = String(m).padStart(2,'0');
      if(yr===y && m>new Date().getMonth()+1) continue;
      opts += `<option value="M${mm}-${yr}">${new Date(yr, m-1, 1).toLocaleDateString('fr-FR',{month:'long'})} ${yr}</option>`;
    }
    opts += `<option value="Y-${yr}">Année ${yr}</option>`;
    opts += `<option value="Q1-${yr}">T1 ${yr}</option><option value="Q2-${yr}">T2 ${yr}</option><option value="Q3-${yr}">T3 ${yr}</option><option value="Q4-${yr}">T4 ${yr}</option>`;
  }
  return opts;
}
async function generateReport(){
  const type = document.getElementById('rp_type').value;
  const periode = document.getElementById('rp_periode').value;
  const stats = computeStatsForPeriod(periode);
  const report = {

  logAction('Génération rapport', `${type} — ${periode}`);

  toast('Rapport généré');

function openReportChart(id){
  const r = DB.reports.find(x=>x.id===id);
  const {start,end} = periodDateRange(r.periode);
  const gerantIds = tousSuperviseurs().map(g=>g.id);

        <div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin-bottom:8px;">CA par grossiste — ${escapeHtml(periodeLabel(r.periode))}</div>
        <div class="chart-wrap" style="height:180px;">${dist.data.every(v=>v===0) ? emptyState('Aucune donnée', 'Aucun CA déclaré.') : '<canvas id="chart_report_dist"></canvas>'}</div>
      </div>
    </div>
    <div style="margin-top:16px;">
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin-bottom:8px;">Réalisation des agents — ${escapeHtml(periodeLabel(r.periode))} (total : ${(r.stats.realisationTotal||0).toLocaleString('fr-FR')} GNF)</div>
      ${agentReal.length===0 ? emptyState('Aucune réalisation','Aucune réalisation déclarée sur cette période.') : `
      <table><thead><tr><th>Agent</th><th>Réalisation</th></tr></thead><tbody>
      ${agentReal.map(x=>`<tr><td>${escapeHtml(x.a.prenom+' '+x.a.nom)}</td><td class="mono"><b>${x.total.toLocaleString('fr-FR')} GNF</b></td></tr>`).join('')}

  if(total>0) drawDoughnut('chart_report_roles', ['Superviseurs','Grossistes','Agents'], [r.stats.superviseurs,r.stats.gerants,r.stats.agents], ['#E8A200','#1F8A4C','#FF6600'], 'Personnel');

/* ---------- RAPPORTS : calcul par période réelle ---------- */
function periodDateRange(periode){
  if(periode.startsWith('Y-')){
    const year = periode.split('-')[1];
    return { start:`${year}-01-01`, end:`${year}-12-31` };
  }
  if(periode.startsWith('M')){
    const [m, year] = periode.split('-');
    const mn = Number(m.replace('M',''));
    const lastDay = new Date(Number(year), mn, 0).getDate();
    return { start:`${year}-${String(mn).padStart(2,'0')}-01`, end:`${year}-${String(mn).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}` };
  }
  const [q, year] = periode.split('-');
  const qn = Number(q.replace('Q',''));
  const startMonth = (qn-1)*3+1;
  const endMonth = startMonth+2;
  const lastDay = new Date(Number(year), endMonth, 0).getDate();
  return {
    start: `${year}-${String(startMonth).padStart(2,'0')}-01`,
    end: `${year}-${String(endMonth).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`
  };
}
function computeStatsForPeriod(periode){
  const {start,end} = periodDateRange(periode);
  const inRange = d => d>=start && d<=end;
  return {
    caTotal: DB.ca.filter(e=>inRange(e.date)).reduce((a,e)=>a+Number(e.montant||0),0),
    omTotal: DB.om.filter(e=>inRange(e.date)).reduce((a,e)=>a+Number(e.montant||0),0),
    tdrTotal: DB.tdr.filter(e=>inRange(e.date)).length,
    tdaTotal: DB.tda.filter(e=>inRange(e.date)).length,
    lpTotal: DB.lp.filter(e=>inRange(e.date)).reduce((a,e)=>a+Number(e.montant||0),0),
    realisationTotal: DB.realisations.filter(e=>inRange(e.date)).reduce((a,e)=>a+Number(e.conversion||0),0),
    simsTotal: DB.sims.filter(s=>s.statut==='attribuee').length,
    superviseurs: DB.users.filter(u=>u.role==='superviseur').length,
    gerants: tousSuperviseurs().length,
    agents: DB.users.filter(u=>u.role==='agent').length,
    pdvs: DB.pdvs.length
  };
}
function periodeLabel(periode){
  if(periode.startsWith('Y-')) return 'Année '+periode.split('-')[1];
  if(periode.startsWith('M')){
    const [m,y] = periode.split('-');
    return new Date(Number(y), Number(m.replace('M',''))-1, 1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
  }
  const [q,y] = periode.split('-');
  return 'T'+q.replace('Q','')+' '+y;
}

function buildPrintableClone(){
  const source = document.getElementById('mainContent');
  const clone = source.cloneNode(true);
  const liveCanvases = source.querySelectorAll('canvas');
  const cloneCanvases = clone.querySelectorAll('canvas');
  cloneCanvases.forEach((c,i)=>{
    const live = liveCanvases[i];
    const img = document.createElement('img');
    img.style.width='100%'; img.style.maxWidth='680px'; img.style.display='block'; img.style.margin='0 auto';
    if(live){ try{ img.src = live.toDataURL('image/png'); }catch(e){} }
    c.replaceWith(img);
  });
  clone.querySelectorAll('button, input, select, textarea').forEach(el=>el.remove());
  return clone;
}

async function exportCurrentPageJPEG(){
  if(typeof html2canvas==='undefined'){ toast('Bibliothèque de capture indisponible'); return; }
  const target = document.getElementById('mainContent');
  const hidden = Array.from(target.querySelectorAll('button, input, select, textarea'));
  hidden.forEach(el=> el.style.visibility='hidden');
  toast('Génération de l\'image…');
  try{
    const canvas = await html2canvas(target, { backgroundColor:'#F7F5F2', scale:2, useCORS:true });
    /* Filigrane EIGHT HUIT dessiné directement sur l'image exportée */
    await new Promise(res=>{
      const logo = new Image();
      logo.onload = ()=>{
        const ctx = canvas.getContext('2d');
        const w = Math.min(canvas.width, canvas.height) * 0.55;
        ctx.globalAlpha = 0.06;
        ctx.drawImage(logo, (canvas.width-w)/2, (canvas.height-w)/2, w, w);
        ctx.globalAlpha = 1;
        res();
      };
      logo.onerror = res;
      logo.src = EH_LOGO;
    });
    const link = document.createElement('a');
    link.download = `maison-orange-${currentView}-${todayStr()}.jpg`;
    link.href = canvas.toDataURL('image/jpeg', 0.92);
    link.click();
    toast('Image JPEG téléchargée');
  }catch(e){
    console.error(e); toast('Erreur lors de la génération de l\'image');
  }finally{
    hidden.forEach(el=> el.style.visibility='');
  }
}

/* ---------- Installation en application native (PWA) ----------
   Enregistre le service worker (nécessaire pour qu'Android/Chrome propose
   « Installer l'application ») et pilote le bouton « 📲 Installer
   l'application » présent sur les écrans de connexion et de pointage. */
let _deferredInstallPrompt = null;
function isRunningStandalone(){
  return window.matchMedia && window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
}
function isIOSDevice(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
}
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  _deferredInstallPrompt = e;
  document.querySelectorAll('#installAppBtn').forEach(b=> b.style.display = isRunningStandalone() ? 'none' : 'block');
});
async function installApp(){
  if(_deferredInstallPrompt){
    _deferredInstallPrompt.prompt();
    await _deferredInstallPrompt.userChoice;
    _deferredInstallPrompt = null;
    document.querySelectorAll('#installAppBtn').forEach(b=> b.style.display='none');
  } else if(isIOSDevice()){
    alert("Pour installer l'application sur iPhone/iPad :\n\n1. Appuyez sur le bouton Partager (le carré avec une flèche vers le haut)\n2. Choisissez « Sur l'écran d'accueil »\n3. Appuyez sur Ajouter\n\nL'application s'ouvrira ensuite en plein écran, comme une vraie application.");
  } else {
    toast("Ouvrez le menu de votre navigateur et choisissez « Installer l'application » ou « Ajouter à l'écran d'accueil ».");
  }
}
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{ /* hébergement sans sw.js : l'app reste utilisable normalement */ });
  });
}
if(!isRunningStandalone() && isIOSDevice()){
  document.querySelectorAll('#installAppBtn').forEach(b=> b.style.display='block');
}

(async function init(){
  await loadDB();
  applyTheme(DB.settings.themeId || 'orange');
  applyBranding();
  startCloudSync();
  startConnectionWatch();
  /* Reconnexion automatique : si cet appareil a déjà une session
     mémorisée (connexion précédente), on entre directement dans
     l'application sans repasser par l'écran de connexion. */
  try{
    const savedId = localStorage.getItem('mo_auto_session');
    if(savedId){
      const u = DB.users.find(x=>x.id===savedId && x.active);
      if(u) enterApp(u);
      else localStorage.removeItem('mo_auto_session');
    }
  }catch(_){}
})();
