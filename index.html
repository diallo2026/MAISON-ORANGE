<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eight Huit — Gestion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --orange:#FF6600;
    --orange-dark:#D14E00;
    --orange-deep:#7A2E00;
    --ink:#1B1B1F;
    --ink-soft:#4A4A52;
    --paper:#F7F5F2;
    --card:#FFFFFF;
    --line:#E7E3DD;
    --ok:#1F8A4C;
    --warn:#C88A00;
    --danger:#C22B2B;
    --locked:#8A8A93;
    --mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
    --sans: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
    --disp: 'Space Grotesk', 'Inter', sans-serif;
    --side-bg: linear-gradient(180deg, #FF6600, #D14E00);
    --side-text: #FFFFFF;
    --side-text-soft: rgba(255,255,255,.75);
    --side-active-bg: rgba(0,0,0,.22);
    --topbar-bg: transparent;
    --topbar-text: #1B1B1F;
    --topbar-sub: #4A4A52;
    --topbar-pad: 0;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--sans);background:var(--paper);color:var(--ink);}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:#DDD7CE;border-radius:6px;}

  /* ---------- LOGIN ---------- */
  #login-screen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,102,0,.10), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(122,46,0,.10), transparent 45%),
      var(--ink);
  }
  .login-card{
    width:min(420px,92vw);background:var(--card);border-radius:4px;
    padding:40px 36px 34px;box-shadow:0 30px 60px rgba(0,0,0,.35);
    border-top:5px solid var(--orange);
  }
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .brand-mark{
    width:34px;height:34px;border-radius:8px;background:var(--orange);
    display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--disp);font-weight:700;
  }
  .brand-name{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:-.01em;}
  .brand-sub{font-size:12px;color:var(--ink-soft);margin:0 0 26px;letter-spacing:.04em;text-transform:uppercase;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px;}
  .field input, .field select{
    width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:4px;
    font-family:var(--mono);font-size:14px;background:#FCFBFA;color:var(--ink);
  }
  .field input:focus, .field select:focus{outline:none;border-color:var(--orange);background:#fff;}
  .btn{
    appearance:none;border:none;cursor:pointer;font-family:var(--sans);font-weight:600;
    border-radius:4px;padding:11px 18px;font-size:14px;transition:.15s;
  }
  .btn-primary{background:var(--btn-bg,var(--orange));color:var(--btn-text,#fff);width:100%;margin-top:8px;}
  .btn-primary:hover{background:var(--btn-bg-dark,var(--orange-dark));}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--btn-bg,var(--orange));color:var(--btn-bg-dark,var(--orange-dark));}
  .btn-sm{padding:6px 12px;font-size:12px;}
  .btn-danger{background:#FBEAEA;color:var(--danger);}
  .btn-danger:hover{background:var(--danger);color:#fff;}
  .login-err{background:#FBEAEA;color:var(--danger);font-size:13px;padding:9px 12px;border-radius:4px;margin-bottom:14px;display:none;}
  .login-hint{margin-top:20px;padding-top:16px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--ink-soft);line-height:1.6;}
  .login-hint b{color:var(--ink);}
  .login-logo-wrap{text-align:center;margin-bottom:14px;}
  .login-logo{width:96px;height:96px;object-fit:contain;display:block;margin:0 auto 6px;}
  .login-brand-line{font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:.01em;}
  .eh-red{color:#D92B2B;} .eh-yellow{color:#E8A200;} .eh-green{color:#1F8A4C;}
  .login-rz-info{
    background:#F2F9F4;border:1px solid #CFE8D8;border-left:4px solid #1F8A4C;
    border-radius:5px;padding:10px 12px;font-size:12px;line-height:1.7;color:var(--ink);
    margin-bottom:16px;
  }
  .login-rz-info b{color:#146034;}
  .login-rz-info .rz-title{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#1F8A4C;margin-bottom:2px;}
  .login-card{position:relative;overflow:hidden;}
  .login-card::before{
    content:'';position:absolute;inset:0;
    background:var(--eh-logo) center / 240px no-repeat;
    opacity:.05;pointer-events:none;
  }
  .login-card > *{position:relative;}
  .btn-pointage{width:100%;margin-top:10px;background:#1F8A4C;color:#fff;}
  .btn-pointage:hover{background:#146034;}
  #pointage-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .pt-clock{text-align:center;font-family:var(--mono);font-size:26px;font-weight:700;color:#1F8A4C;margin:6px 0 12px;}
  .pt-ok{display:none;background:#EAF7EF;border:1px solid #BFE5CC;border-left:4px solid #1F8A4C;color:#146034;border-radius:5px;padding:10px 12px;font-size:12.5px;margin-bottom:12px;line-height:1.6;}
  .pt-sep{text-align:center;font-size:11px;color:var(--ink-soft);margin:10px 0;}
  .app-version{text-align:center;font-size:10.5px;color:var(--ink-soft);margin-top:14px;letter-spacing:.03em;}
  .btn-finger{width:100%;background:linear-gradient(135deg,#1F8A4C,#146034);color:#fff;font-size:15px;padding:13px;}
  .btn-finger:hover{filter:brightness(1.1);}
  .pt-photo-toggle{margin:4px 0 10px;}
  .pt-photo-toggle .btn{width:100%;}
  .pt-sort-row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-soft);margin-bottom:10px;}
  .pt-sort-row select{flex:1;padding:6px 8px;border:1.5px solid var(--line);border-radius:5px;font-size:12px;background:#fff;}
  .pt-photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px;max-height:320px;overflow-y:auto;padding:2px;margin-bottom:12px;}
  .pt-photo-tile{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;border:none;background:none;padding:6px 2px;border-radius:8px;transition:.15s;}
  .pt-photo-tile:hover{background:#F2F9F4;}
  .pt-photo-tile:active{transform:scale(.94);}
  .pt-photo-tile img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2.5px solid var(--line);}
  .pt-photo-tile.present img{border-color:#1F8A4C;}
  .pt-photo-tile.sorti img{border-color:#8A8A93;opacity:.55;}
  .pt-photo-tile .pt-tile-name{font-size:9.5px;text-align:center;line-height:1.2;color:var(--ink);max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pt-photo-tile .pt-tile-dot{width:6px;height:6px;border-radius:50%;background:#D1CDC5;margin-top:-2px;}
  .pt-photo-tile.present .pt-tile-dot{background:#1F8A4C;}
  .pt-photo-tile.sorti .pt-tile-dot{background:#8A8A93;}
  .pt-confirm-card{
    background:#F7F5F2;border:1.5px solid var(--line);border-radius:10px;
    padding:16px;margin-top:4px;text-align:center;
  }
  .pt-confirm-card img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2.5px solid #1F8A4C;margin-bottom:8px;}
  .pt-confirm-name{font-weight:700;font-size:14.5px;color:var(--ink);}
  .pt-confirm-action{font-size:12px;color:var(--ink-soft);margin:2px 0 12px;}
  .pt-confirm-action b{color:#1F8A4C;}
  .pt-confirm-card input{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;font-size:15px;text-align:center;letter-spacing:.08em;margin-bottom:10px;}
  .pt-confirm-row{display:flex;gap:8px;}
  .pt-confirm-row .btn{flex:1;margin-top:0;}
  .pt-confirm-err{color:var(--danger);font-size:11.5px;margin:-4px 0 10px;min-height:14px;}
  .pt-choice-row{display:flex;gap:10px;justify-content:center;margin:4px 0 14px;}
  .pt-choice-opt{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;padding:8px 16px;border:1.5px solid var(--line);border-radius:6px;background:#fff;}
  .pt-choice-opt:has(input:checked){border-color:#1F8A4C;background:#EAF7EF;color:#146034;}
  .pt-choice-opt input{accent-color:#1F8A4C;}
  /* Panneaux repliables : bouton ▾ sur chaque panneau + tête cliquable */
  .panel-head{cursor:pointer;user-select:none;}
  .fold-btn{
    background:var(--btn-bg,var(--orange));color:#fff;border:none;border-radius:5px;
    width:26px;height:26px;font-size:12px;cursor:pointer;flex-shrink:0;line-height:1;
    display:inline-flex;align-items:center;justify-content:center;margin-left:auto;
  }
  .fold-btn:hover{background:var(--btn-bg-dark,var(--orange-dark));}
  .panel.folded .panel-body{display:none;}
  .panel.folded{padding-bottom:0;}
  .panel.folded .panel-head{border-bottom:none;}
  /* Groupes d'onglets (sections à sous-onglets) — repliables comme les panneaux */
  .tabgroup{border:1px solid var(--line);border-radius:8px;margin-bottom:16px;overflow:hidden;background:#FCFBFA;}
  .tabgroup-head{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;background:var(--panelhead-bg,#F7F5F2);cursor:pointer;}
  .tabgroup-head h3{margin:0;font-family:var(--disp);font-size:14.5px;color:var(--panelhead-text,var(--ink));}
  .tabgroup-body{padding:14px 16px 16px;}
  .tabgroup.folded .tabgroup-body{display:none;}
  .tabgroup.folded{padding-bottom:0;}
  .tabgroup.folded .tabgroup-head{border-bottom:none;}
  /* Visuels type infographie : jauges circulaires colorées */
  .gauge-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:14px;padding:6px 2px;}
  .gauge-item{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .gauge-svg{width:76px;height:76px;}
  .gauge-label{font-size:10.5px;color:var(--ink-soft);text-align:center;font-weight:600;}
  .minibar-row{display:flex;align-items:flex-end;gap:14px;padding:10px 4px 2px;justify-content:space-around;}
  .minibar-item{display:flex;flex-direction:column;align-items:center;gap:5px;}
  .minibar-track{width:26px;height:80px;display:flex;align-items:flex-end;background:#F4F1EB;border-radius:6px;overflow:hidden;}
  .minibar-fill{width:100%;border-radius:6px 6px 0 0;transition:height .3s;}
  .minibar-val{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink);}
  .minibar-label{font-size:9.5px;color:var(--ink-soft);text-align:center;max-width:60px;}

  /* ---------- APP SHELL ---------- */
  #app{display:none;min-height:100vh;grid-template-columns:230px 1fr;}
  #app.active{display:grid;}
  aside{
    background:var(--side-bg);color:var(--side-text);padding:20px 14px;display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;min-height:100%;overflow-y:auto;overflow-x:hidden;
  }
  .side-brand{display:flex;align-items:center;gap:9px;padding:6px 8px 20px;border-bottom:1px solid rgba(255,255,255,.22);margin-bottom:14px;}
  .side-brand .brand-mark{width:28px;height:28px;font-size:13px;overflow:hidden;padding:0;}
  .side-brand .brand-mark img{width:100%;height:100%;object-fit:cover;border-radius:8px;}
  .side-brand-text{font-family:var(--disp);font-weight:700;font-size:14.5px;color:var(--side-text);}
  .side-role{font-size:10px;color:var(--side-text-soft);text-transform:uppercase;letter-spacing:.06em;margin-top:1px;}
  nav{flex:1;display:flex;flex-direction:column;gap:2px;}
  nav .nav-label{
    font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--side-text-soft);
    margin:14px 4px 6px;padding:4px 6px;cursor:pointer;user-select:none;
    display:flex;align-items:center;justify-content:space-between;border-radius:4px;
  }
  nav .nav-label:hover{background:rgba(255,255,255,.10);}
  nav .nav-label .nav-fold-arrow{font-size:9px;transition:transform .15s;}
  nav .nav-group.collapsed .nav-fold-arrow{transform:rotate(-90deg);}
  nav .nav-group{overflow:hidden;transition:max-height .18s ease;}
  nav .nav-group.collapsed .nav-items{display:none;}
  nav button{
    all:unset;cursor:pointer;padding:9px 10px;border-radius:5px;font-size:13.5px;color:var(--side-text-soft);
    display:flex;align-items:center;gap:9px;transition:.12s;
  }
  nav button:hover{background:rgba(255,255,255,.14);color:var(--side-text);}
  nav button.active{background:var(--side-active-bg);color:var(--side-text);font-weight:600;}
  nav button .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.6;}
  .side-user{border-top:1px solid rgba(255,255,255,.22);padding-top:12px;margin-top:8px;}
  .side-user-name{font-size:13px;font-weight:600;color:var(--side-text);}
  .side-user-code{font-size:11px;color:var(--side-text-soft);font-family:var(--mono);}
  .side-logout{margin-top:10px;width:100%;background:transparent;color:var(--side-text);border:1.5px solid var(--side-text-soft);}
  .side-logout:hover{border-color:var(--side-text);color:var(--side-text);background:rgba(255,255,255,.12);}

  main{padding:24px 30px 60px;overflow-x:hidden;position:relative;}
  /* Filigrane EIGHT HUIT sur toute l'application */
  main::before{
    content:'';position:fixed;top:0;bottom:0;left:230px;right:0;
    background:var(--eh-logo) center / min(440px,70vw) no-repeat;
    opacity:.055;pointer-events:none;z-index:0;
  }
  main > *{position:relative;z-index:1;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;flex-wrap:wrap;gap:10px;background:var(--topbar-bg);color:var(--topbar-text);padding:var(--topbar-pad);border-radius:8px;}
  .topbar h1{font-family:var(--disp);font-size:24px;margin:0 0 4px;letter-spacing:-.01em;color:inherit;}
  .topbar p{margin:0;color:var(--topbar-sub);font-size:13.5px;}
  .topbar .btn-ghost{color:var(--topbar-text);border-color:var(--topbar-text);}
  .topbar .btn-ghost:hover{background:rgba(255,255,255,.15);}
  .conn-badge{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:600;margin:10px 0 4px;padding:6px 9px;border-radius:5px;background:rgba(0,0,0,.18);color:var(--side-text);}
  .conn-dot{width:8px;height:8px;border-radius:50%;background:#8A8A93;flex-shrink:0;}
  .conn-badge.on .conn-dot{background:#3DDC84;box-shadow:0 0 6px rgba(61,220,132,.8);}
  .conn-badge.off .conn-dot{background:#FF5252;}
  .theme-form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:12px;}
  .theme-form-grid input[type=color]{width:100%;height:38px;padding:2px;border:1.5px solid var(--line);border-radius:4px;background:#FCFBFA;cursor:pointer;}
  .theme-swatch-del{display:block;margin:6px auto 0;background:#FBEAEA;color:var(--danger);border:none;border-radius:4px;font-size:10.5px;font-weight:600;padding:3px 10px;cursor:pointer;}
  .reset-check-list{display:flex;flex-direction:column;gap:9px;}
  .reset-check{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink);padding:9px 12px;border:1.5px solid var(--line);border-radius:6px;cursor:pointer;background:#FCFBFA;}
  .reset-check:hover{border-color:var(--danger);}
  .reset-check input{accent-color:var(--danger);width:16px;height:16px;flex-shrink:0;}
  .theme-swatch-del:hover{background:var(--danger);color:#fff;}
  .lock-banner{
    background:#FFF4E9;border:1px solid #FFD8AE;color:var(--orange-deep);
    padding:10px 14px;border-radius:5px;font-size:12.5px;margin-bottom:18px;display:flex;gap:12px;align-items:center;
  }
  .lock-banner .banner-text{flex:1;}
  .day-arc{flex-shrink:0;display:flex;align-items:center;gap:8px;}
  .day-arc svg{display:block;}
  .day-arc-label{font-family:var(--mono);font-size:10.5px;color:var(--orange-deep);white-space:nowrap;}
  .export-btn{display:inline-flex;align-items:center;gap:5px;}

  .grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:24px;}
  .stat-card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px 18px;position:relative;overflow:hidden;}
  .stat-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--orange);}
  .stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin-bottom:8px;}
  .stat-value{font-family:var(--disp);font-size:28px;font-weight:700;}
  .stat-sub{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:6px;margin-bottom:20px;}
  .panel-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:8px;background:var(--panelhead-bg,transparent);}
  .panel-head h2{font-family:var(--disp);font-size:16px;margin:0;color:var(--panelhead-text,var(--ink));}
  .panel-body{padding:16px 18px;}
  .panel-actions{display:flex;gap:8px;flex-wrap:wrap;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{
    text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--th-text,var(--ink-soft));background:var(--th-bg,transparent);
    padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap;
  }
  th:first-child{border-radius:5px 0 0 0;} th:last-child{border-radius:0 5px 0 0;}
  td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr:hover td{background:#FBFAF8;}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;}
  .badge-ok{background:#E4F6EB;color:var(--ok);}
  .badge-warn{background:#FFF3DC;color:var(--warn);}
  .badge-danger{background:#FBEAEA;color:var(--danger);}
  .badge-locked{background:#EDEDEF;color:var(--locked);}
  .badge-orange{background:#FFE9D9;color:var(--orange-dark);}
  .mono{font-family:var(--mono);font-size:12.5px;}
  .muted{color:var(--ink-soft);}

  .empty{padding:36px 20px;text-align:center;color:var(--ink-soft);font-size:13.5px;}
  .empty b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:4px;font-family:var(--disp);}

  .modal-bg{position:fixed;inset:0;background:rgba(20,15,10,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal-bg.active{display:flex;}
  .modal{background:#fff;border-radius:6px;width:min(480px,100%);max-height:88vh;overflow-y:auto;border-top:4px solid var(--orange);}
  .modal-head{padding:18px 20px 10px;display:flex;justify-content:space-between;align-items:center;}
  .modal-head h3{font-family:var(--disp);font-size:17px;margin:0;}
  .modal-close{cursor:pointer;background:none;border:none;font-size:20px;color:var(--ink-soft);}
  .modal-body{padding:6px 20px 20px;}
  .modal-body .field{margin-bottom:14px;}
  .modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:0 20px 20px;}

  .tag-row{display:flex;gap:6px;flex-wrap:wrap;}
  .perm-chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:#F3F1EE;padding:4px 9px;border-radius:20px;}
  .perm-chip input{margin:0;}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;}
  .tab-btn{all:unset;cursor:pointer;padding:9px 14px;font-size:13px;color:var(--ink-soft);border-bottom:2px solid transparent;}
  .tab-btn.active{color:var(--orange-dark);border-bottom-color:var(--orange);font-weight:600;}

  .search-input{padding:8px 10px;border:1.5px solid var(--line);border-radius:4px;font-size:13px;min-width:200px;}
  .toast{
    position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:5px;
    font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:200;display:none;border-left:3px solid var(--orange);
  }
  .toast.active{display:block;}
  select, input[type=text], input[type=number], input[type=date], textarea{
    font-family:var(--sans);font-size:13.5px;padding:9px 10px;border:1.5px solid var(--line);border-radius:4px;width:100%;background:#FCFBFA;
  }
  select:focus, input:focus, textarea:focus{outline:none;border-color:var(--orange);background:#fff;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .hist-item{border-left:2px solid var(--orange); padding:6px 0 6px 12px; margin-bottom:6px; font-size:12.5px;}
  .hist-item .h-date{color:var(--ink-soft); font-family:var(--mono); font-size:11px;}

  /* Organigramme */
  .org-chart{display:flex;flex-direction:column;align-items:center;gap:22px;padding:10px 0 4px;}
  .org-card{
    background:#FCFBFA;border:1.5px solid var(--line);border-radius:6px;padding:10px 16px;
    cursor:pointer;transition:.12s;min-width:150px;text-align:center;
  }
  .org-card:hover{border-color:var(--orange);box-shadow:0 4px 10px rgba(255,102,0,.12);transform:translateY(-1px);}
  .org-root{background:var(--ink);color:#fff;border-color:var(--ink);cursor:default;}
  .org-root:hover{transform:none;box-shadow:none;}
  .org-root .org-role{color:#FF9E52;}
  .org-name{font-family:var(--disp);font-weight:600;font-size:13.5px;}
  .org-role{font-size:10.5px;color:var(--ink-soft);margin-top:2px;text-transform:uppercase;letter-spacing:.03em;}
  .org-root .org-name{font-size:15px;}
  .org-branches{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;padding-top:20px;border-top:2px dashed var(--line);width:100%;position:relative;}
  .org-node{display:flex;flex-direction:column;align-items:center;gap:14px;position:relative;}
  .org-node::before{content:"";position:absolute;top:-20px;left:50%;width:1px;height:20px;background:var(--line);}
  .org-children{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:340px;padding-top:12px;border-top:1px dashed var(--line);}
  .org-leaf{min-width:110px;padding:8px 10px;}
  .org-leaf .org-name{font-size:12px;}
  .org-agent{background:#FFF4E9;}
  .org-empty{font-size:11.5px;color:var(--ink-soft);font-style:italic;}

  /* Objectifs & graphiques */
  .chart-wrap{position:relative;height:240px;margin-bottom:4px;}
  .progress-track{background:#EFEBE4;border-radius:20px;height:10px;overflow:hidden;margin-top:6px;}
  .progress-fill{height:100%;background:var(--orange);border-radius:20px;transition:width .3s;}
  .progress-fill.over{background:var(--ok);}
  .obj-row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;margin-bottom:4px;}
  .obj-row b{font-family:var(--disp);}
  .compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .delta-up{color:var(--ok);font-weight:600;}
  .delta-down{color:var(--danger);font-weight:600;}

  /* Cartes PDV */
  .pdv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
  .pdv-card{
    background:#FCFBFA;border:1.5px solid var(--line);border-radius:6px;padding:14px 16px;cursor:pointer;transition:.12s;
  }
  .pdv-card:hover{border-color:var(--orange);box-shadow:0 6px 16px rgba(255,102,0,.12);transform:translateY(-2px);}
  .pdv-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px;}
  .pdv-card-name{font-family:var(--disp);font-weight:600;font-size:14.5px;}
  .pdv-card-lieu{font-size:11.5px;color:var(--ink-soft);margin-bottom:12px;}
  .pdv-card-stats{display:flex;justify-content:space-between;border-top:1px dashed var(--line);padding-top:10px;}
  .pdv-card-stats > div{display:flex;flex-direction:column;}
  .pdv-stat-val{font-family:var(--disp);font-weight:700;font-size:13px;}
  .pdv-stat-lab{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin-top:1px;}

  /* Paramètres — thèmes & logo */
  .theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
  .theme-swatch{border:2px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;transition:.12s;}
  .theme-swatch:hover{border-color:var(--orange);}
  .theme-swatch.active{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,102,0,.15);}
  .theme-swatch-bar{height:34px;border-radius:5px;margin-bottom:8px;}
  .theme-swatch-name{font-size:12px;font-weight:600;text-align:center;}
  .logo-upload-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .logo-preview{width:72px;height:72px;border-radius:14px;object-fit:cover;border:1.5px solid var(--line);background:#FCFBFA;}
  .settings-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap;}

  /* Photo de profil */
  .photo-upload-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:4px;}
  .photo-preview{width:76px;height:76px;border-radius:50%;object-fit:cover;border:2px solid var(--line);background:#EFEBE4;}
  .avatar-sm{width:28px;height:28px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:8px;border:1px solid var(--line);background:#EFEBE4;}
  .name-cell{display:flex;align-items:center;}
</style>
</head>

      <div class="login-brand-line"><span class="eh-red">EIGHT</span> <span class="eh-yellow">HUIT</span> <span class="eh-green">Technology</span></div>
    </div>
    <div class="brand" style="justify-content:center;">
      <div class="brand-name" id="loginBrandName">Eight Huit</div>
    </div>

    <div class="login-rz-info" id="loginRzInfo"></div>

    <div class="field">
      <label>Code d'accès</label>
      <input type="text" id="loginCode" placeholder="ex : RZ-0001" autocomplete="off" autocapitalize="off">
    </div>
    <div class="field">
      <label>Mot de passe</label>
      <input type="text" id="loginPass" placeholder="Mot de passe" autocomplete="off" autocapitalize="off">

    <button class="btn btn-pointage" onclick="openPointageScreen()">🕐 Pointage du personnel</button>
    <div class="app-version">Version 2.0 — EIGHT HUIT Technology</div>
  </div>
</div>

<!-- ============ POINTAGE ============ -->
<div id="pointage-screen" style="display:none;">
  <div class="login-card">
    <div class="login-logo-wrap">
      <img class="login-logo" id="ptLogoImg" alt="EIGHT HUIT Technology">
      <div class="login-brand-line"><span class="eh-red">EIGHT</span> <span class="eh-yellow">HUIT</span> <span class="eh-green">Technology</span></div>
    </div>
    <p class="brand-sub" style="text-align:center;">Pointage du personnel</p>
    <div class="pt-clock" id="ptClock">—</div>

    <div class="pt-ok" id="ptOk"></div>

    <div class="pt-sep" id="ptSep" style="display:none;">— ou —</div>
    <div class="pt-photo-toggle">
      <button class="btn btn-ghost btn-sm" onclick="togglePtPhotoGrid()" id="ptPhotoToggleBtn">👥 Pointer en touchant sa photo</button>
    </div>
    <div id="ptPhotoPanel" style="display:none;">
      <div class="pt-sort-row">
        <label>Trier par :</label>
        <select id="ptSort" onchange="renderPtPhotoGrid()">
          <option value="nom">Nom (A→Z)</option>
          <option value="role">Rôle</option>
          <option value="statut">Présents en premier</option>

      </div>
      <div class="pt-photo-grid" id="ptPhotoGrid"></div>
      <div id="ptConfirmZone" style="display:none;"></div>
    </div>
    <button class="btn btn-ghost" style="width:100%;margin-top:8px;" onclick="openConfigEmpreinte()">⚙ Configurer l'empreinte sur cet appareil</button>
    <button class="btn btn-ghost" style="width:100%;margin-top:8px;" onclick="closePointageScreen()">← Retour à la connexion</button>
    <div class="app-version">Version 2.0 — EIGHT HUIT Technology</div>
  </div>
</div>

    <div class="side-brand">

        <div class="side-role" id="sideRoleLabel">—</div>

let rtdb = null;

/* Identifiant unique de cet appareil/onglet : permet d'ignorer l'écho de
   ses propres écritures dans le listener temps réel. */
const CLIENT_ID = Math.random().toString(36).slice(2) + Date.now().toString(36);

function localStorageFallback(){
  window.storage = {
    async get(key, shared){
      const raw = localStorage.getItem('mo_'+key);
      if(raw===null){ const err=new Error('Clé introuvable : '+key); throw err; }
      return { key, value: raw, shared: !!shared };
    },
    async set(key, value, shared){
      localStorage.setItem('mo_'+key, value);
      return { key, value, shared: !!shared };
    },
    async delete(key, shared){
      localStorage.removeItem('mo_'+key);
      return { key, deleted:true, shared: !!shared };
    },
    async list(prefix, shared){
      const p = 'mo_'+(prefix||'');
      const keys = Object.keys(localStorage).filter(k=>k.startsWith(p)).map(k=>k.slice(3));
      return { keys, prefix, shared: !!shared };
    }
  };
}

if(typeof window.storage === 'undefined'){
  try{
    if(typeof firebase === 'undefined') throw new Error('SDK Firebase non chargé');
    firebase.initializeApp(FIREBASE_CONFIG);
    rtdb = firebase.database();
    const ROOT = 'maison_orange_storage';
    /* Les chemins RTDB interdisent . # $ [ ] / — on encode ces caractères. */
    const safeKey = k => encodeURIComponent(String(k)).replace(/\./g,'%2E');
    const nodeRef = (key, shared) => rtdb.ref(ROOT + '/' + (shared ? 'shared_' : 'private_') + safeKey(key));

    window.storage = {
      async get(key, shared){
        const snap = await nodeRef(key,shared).get();
        if(!snap.exists()){ const err=new Error('Clé introuvable : '+key); throw err; }
        return { key, value: snap.val().value, shared: !!shared };
      },
      async set(key, value, shared){
        await nodeRef(key,shared).set({ value, updatedAt: Date.now(), clientId: CLIENT_ID });
        return { key, value, shared: !!shared };
      },
      async delete(key, shared){
        await nodeRef(key,shared).remove();
        return { key, deleted:true, shared: !!shared };
      },
      async list(prefix, shared){
        const snap = await rtdb.ref(ROOT).get();
        const pfx = (shared ? 'shared_' : 'private_') + safeKey(prefix||'');
        const keys = [];
        if(snap.exists()){
          snap.forEach(child=>{
            if(child.key.startsWith(pfx)){
              keys.push(decodeURIComponent(child.key.replace(/^shared_|^private_/,'')));
            }
          });
        }
        return { keys, prefix, shared: !!shared };
      }
    };
    cloudSyncActive = true;
  }catch(e){
    console.warn('Realtime Database indisponible, bascule sur le stockage local du navigateur.', e);
    localStorageFallback();
  }
}

/* ---------- SYNCHRONISATION TEMPS REEL ----------
   Dès qu'un autre appareil (RZ, superviseur, gérant, agent) enregistre une
   modification, ce listener met à jour la base localement et rafraîchit
   l'écran affiché, sans que l'utilisateur ait besoin de recharger la page. */
function startCloudSync(){
  if(!cloudSyncActive || !rtdb) return;
  rtdb.ref('maison_orange_storage/shared_db')
    .on('value', snap=>{
      if(!snap.exists()) return;
      const data = snap.val();
      if(!data || !data.value) return;
      /* On ignore l'écho de nos propres écritures (déjà appliquées localement). */
      if(data.clientId === CLIENT_ID) return;
      try{
        const remoteDB = JSON.parse(data.value);
        DB = remoteDB;
        ensureDefaults();
        try{ localStorage.setItem('mo_db_cache', data.value); }catch(_){}
        /* Le thème et l'identité choisis sur un autre appareil s'appliquent ici aussi. */
        applyTheme(DB.settings.themeId || 'orange');
        applyBranding();
        if(SESSION){
          const stillActive = DB.users.some(u=>u.id===SESSION.id && u.active);
          if(stillActive){ SESSION = DB.users.find(u=>u.id===SESSION.id); render(); }
        }
      }catch(e){ console.error('Erreur de synchronisation cloud', e); }
    }, err=> console.warn('Synchronisation temps réel interrompue', err));
}

/* ---------- INDICATEUR EN LIGNE / HORS LIGNE ----------
   Surveille la connexion réelle à la Realtime Database (.info/connected)
   et met à jour le badge dans la barre latérale. */
function setConnBadge(state, label){
  const badge = document.getElementById('connBadge');
  const txt = document.getElementById('connBadgeText');
  if(!badge || !txt) return;
  badge.classList.remove('on','off');
  if(state==='on') badge.classList.add('on');
  if(state==='off') badge.classList.add('off');
  txt.textContent = label;
}
function startConnectionWatch(){
  if(!cloudSyncActive || !rtdb){
    setConnBadge('off', 'Mode local (hors base)');
    return;
  }
  rtdb.ref('.info/connected').on('value', snap=>{
    if(snap.val() === true) setConnBadge('on', 'En ligne — base synchronisée');
    else setConnBadge('off', 'Hors ligne');
  });
}

/* ---------- UTILITAIRES ---------- */
function uid(prefix){ return prefix + '-' + Math.random().toString(36).slice(2,7).toUpperCase(); }
function nowISO(){ return new Date().toISOString(); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}) + ' ' + d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function isToday(iso){ return iso && iso.slice(0,10) === todayStr(); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('active'); setTimeout(()=>t.classList.remove('active'),2600); }
function genPass(){ const s='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let p=''; for(let i=0;i<6;i++) p+=s[Math.floor(Math.random()*s.length)]; return p; }
function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- OBJECTIFS & GRAPHIQUES (CA / TDR / TDA / LP) ---------- */
const chartInstances = {};
function destroyChart(id){ if(chartInstances[id]){ chartInstances[id].destroy(); delete chartInstances[id]; } }
function drawChart(canvasId, type, labels, data, color, labelText){
  destroyChart(canvasId);
  const el = document.getElementById(canvasId);
  if(!el || typeof Chart==='undefined') return;
  /* Dégradé vertical élégant pour les courbes et histogrammes */
  const ctx = el.getContext('2d');
  let fillStyle = type==='bar' ? color+'D9' : color+'26';
  try{
    const grad = ctx.createLinearGradient(0, 0, 0, el.parentElement.clientHeight || 260);
    if(type==='line'){ grad.addColorStop(0, color+'55'); grad.addColorStop(1, color+'05'); }
    else { grad.addColorStop(0, color); grad.addColorStop(1, shadeColor(color, -0.3)); }
    fillStyle = grad;
  }catch(_){}
  chartInstances[canvasId] = new Chart(el, {
    type: type,

/* ---------- Jauges circulaires colorées (style infographie) ----------
   Une rangée de cercles avec pourcentage au centre, chacun dans une couleur
   vive différente — pour un tableau de bord visuellement riche. */
function gaugeRow(items){
  /* items: [{label, pct, color}] — pct de 0 à 100 */
  const R = 34, C = 2*Math.PI*R;
  return `<div class="gauge-row">
    ${items.map(it=>{
      const off = C - (Math.max(0,Math.min(100,it.pct))/100)*C;
      return `<div class="gauge-item">
        <svg viewBox="0 0 84 84" class="gauge-svg">
          <circle cx="42" cy="42" r="${R}" fill="none" stroke="#EEE9E2" stroke-width="8"/>
          <circle cx="42" cy="42" r="${R}" fill="none" stroke="${it.color}" stroke-width="8"
            stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"
            transform="rotate(-90 42 42)"/>
          <text x="42" y="47" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-weight="700" font-size="17" fill="${it.color}">${Math.round(it.pct)}%</text>
        </svg>
        <div class="gauge-label">${escapeHtml(it.label)}</div>
      </div>`;
    }).join('')}
  </div>`;
}
/* Mini-histogramme dégradé multicolore (façon infographie), sans Chart.js —
   utile pour les cartes compactes du tableau de bord. */
function miniBarRow(items){
  /* items: [{label, value, max, color}] */
  return `<div class="minibar-row">
    ${items.map(it=>{
      const h = it.max? Math.max(4, Math.round((it.value/it.max)*72)) : 4;
      return `<div class="minibar-item">
        <div class="minibar-track"><div class="minibar-fill" style="height:${h}px;background:${it.color};"></div></div>
        <div class="minibar-val">${Number(it.value).toLocaleString('fr-FR')}</div>
        <div class="minibar-label">${escapeHtml(it.label)}</div>
      </div>`;
    }).join('')}
  </div>`;
}
function unitFor(type){
  if(type==='lp') return 'présences';
  if(type==='sim') return 'SIM';
  if(type==='tdr' || type==='tda') return '%';
  return 'GNF';
}

function allThemes(){
  const customs = (DB && DB.settings && Array.isArray(DB.settings.customThemes)) ? DB.settings.customThemes : [];
  return THEMES.concat(customs);
}
function applyTheme(themeId){
  const t = allThemes().find(x=>x.id===themeId) || THEMES[0];
  const root = document.documentElement.style;
  root.setProperty('--side-bg', t.bg);
  root.setProperty('--side-text', t.text);
  root.setProperty('--side-text-soft', t.textSoft);
  root.setProperty('--side-active-bg', t.activeBg);
  const topBg = t.topBg || 'transparent';
  root.setProperty('--topbar-bg', topBg);
  root.setProperty('--topbar-text', t.topText || '#1B1B1F');
  root.setProperty('--topbar-sub', t.topSub || (t.topText ? t.topText : '#4A4A52'));
  root.setProperty('--topbar-pad', topBg==='transparent' ? '0' : '12px 16px');
  /* Boutons (tous les boutons oranges suivent le thème) */
  root.setProperty('--btn-bg', t.btn || '#FF6600');
  root.setProperty('--btn-bg-dark', t.btnDark || shadeColor(t.btn || '#FF6600', -0.25));
  root.setProperty('--btn-text', '#FFFFFF');
  /* Titres des entrées (en-têtes de tableaux) et têtes de panneaux : suivent le thème */
  const base = t.btn || '#FF6600';
  root.setProperty('--th-bg', base);
  root.setProperty('--th-text', '#FFFFFF');
  root.setProperty('--panelhead-bg', shadeColor(base, 0.88));
  root.setProperty('--panelhead-text', shadeColor(base, -0.45));
}
/* Assombrit/éclaircit une couleur hex (f entre -1 et 1) */
function shadeColor(hex, f){
  const h = (hex||'#FF6600').replace('#','');
  const r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
  const s = v => Math.max(0, Math.min(255, Math.round(f<0 ? v*(1+f) : v+(255-v)*f)));
  return '#'+[s(r),s(g),s(b)].map(v=>v.toString(16).padStart(2,'0')).join('');
}
/* Convertit une couleur hex en version adoucie (pour les textes secondaires). */
function softColor(hex){
  const h = (hex||'#FFFFFF').replace('#','');
  const r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
  return `rgba(${r},${g},${b},.72)`;
}
function monthKey(dateStr){ return (dateStr||todayStr()).slice(0,7); }
function objKey(type, gerantId, ym){ return `${type}_${gerantId}_${ym}`; }
function getObjectif(type, gerantId, ym){ return Number(DB.objectifs[objKey(type,gerantId,ym)] || 0); }
function computeMonthTotal(type, gerantId, ym){
  if(type==='sim'){
    /* SIM attribuées dans le mois sur les PDV de ce gérant */
    const myPdvIds = DB.pdvs.filter(p=>p.gerantId===gerantId).map(p=>p.id);
    return DB.sims.filter(s=> myPdvIds.includes(s.pdvId))
      .reduce((a,s)=> a + (s.history||[]).filter(h=>h.event==='Attribution' && monthKey(String(h.ts).slice(0,10))===ym).length, 0);
  }
  return (DB[type]||[]).filter(e=> e.gerantId===gerantId && monthKey(e.date)===ym).reduce((a,e)=>a+Number(e.montant||0),0);
}
function last14DaysSeries(type, gerantId, days){
  days = days || 14;
  const labels=[], data=[];
  for(let i=days-1;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const ds = d.toISOString().slice(0,10);
    labels.push(d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}));
    const sum = DB[type].filter(e=> e.date===ds && (!gerantId || e.gerantId===gerantId)).reduce((a,e)=>a+Number(e.montant||0),0);
    data.push(sum);
  }
  return {labels, data};
}
function totalsByGerant(type, gerantIds, dateFilterFn){
  const labels=[], data=[];
  gerantIds.forEach(gid=>{
    const g = DB.users.find(u=>u.id===gid);
    if(!g) return;
    const sum = DB[type].filter(e=> e.gerantId===gid && (!dateFilterFn || dateFilterFn(e.date))).reduce((a,e)=>a+Number(e.montant||0),0);
    labels.push(g.prenom+' '+g.nom.charAt(0)+'.');
    data.push(sum);
  });
  return {labels, data};
}
function objectifProgressHtml(type, gerantId){
  const ym = todayStr().slice(0,7);
  const target = getObjectif(type, gerantId, ym);
  const actual = computeMonthTotal(type, gerantId, ym);
  if(!target) return `<div class="muted" style="font-size:12px;">Aucun objectif défini pour ${typeLabel(type)} ce mois-ci.</div>`;
  const pct = Math.min(100, Math.round((actual/target)*100));
  return `<div class="obj-row"><span>Objectif ${typeLabel(type)} — ${new Date().toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</span><b>${actual.toLocaleString('fr-FR')} / ${target.toLocaleString('fr-FR')} ${unitFor(type)}</b></div>

/* ---------- SIGNATURE : ARC DE CYCLE JOURNALIER ----------
   Représente visuellement l'heure du jour restante avant le verrouillage
   de l'accès superviseur à minuit (00:00). Réapparaît partout où la règle
   "accès limité au jour courant" s'applique. */
function dayArcSVG(size){
  size = size || 40;
  const now = new Date();
  const pct = (now.getHours()*60+now.getMinutes())/1440; // fraction du jour écoulée
  const r = size/2 - 4;
  const c = size/2;
  const circumference = 2*Math.PI*r;
  const dash = circumference*pct;
  const remain = 24 - (now.getHours() + now.getMinutes()/60);
  const hRestantes = remain.toFixed(1);
  return `<div class="day-arc">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#F3DFC4" stroke-width="4"/>
      <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#FF6600" stroke-width="4"
        stroke-linecap="round" stroke-dasharray="${dash} ${circumference}"
        transform="rotate(-90 ${c} ${c})"/>
    </svg>
    <span class="day-arc-label">${hRestantes} h avant verrouillage</span>
  </div>`;
}

/* ---------- PERSISTENCE (localStorage-like via storage API, fallback to JS var if unavailable) ---------- */
function ensureDefaults(){
  if(!DB.objectifs) DB.objectifs={};
  if(!DB.objectifsSup) DB.objectifsSup={};
  if(!DB.settings) DB.settings={logo:null,themeId:'orange',nomZone:'Eight Huit',adresse:'',contactTel:'',contactEmail:'',customThemes:[]};
  if(!DB.settings.nomZone) DB.settings.nomZone='Eight Huit';
  if(!Array.isArray(DB.settings.customThemes)) DB.settings.customThemes=[];
  if(!Array.isArray(DB.om)) DB.om=[];
  if(!Array.isArray(DB.pointages)) DB.pointages=[];
  /* Migration : le code de pointage DOIT toujours être identique au mot de
     passe. Des comptes créés/modifiés avant la mise en place de cette règle
     (ou dont un code personnalisé avait été défini manuellement) pouvaient
     garder un ancien code différent du mot de passe actuel, ce qui faisait
     échouer la validation par mot de passe au pointage. On force l'accord
     à chaque chargement, pour tout le monde, sans exception. */
  if(Array.isArray(DB.users)) DB.users.forEach(u=>{ u.codePointage = u.pass; });
}
async function loadDB(){
  let raw = null;
  try{
    const res = await window.storage.get('db', true);
    raw = res && res.value;
  }catch(e){
    const msg = (e && e.message) ? e.message : '';
    const notFound = /introuvable/i.test(msg);
    if(!notFound){
      /* Erreur réseau ou permission refusée : on N'ÉCRASE JAMAIS la base cloud.
         On utilise la copie locale de secours pour rester utilisable. */
      console.warn('Lecture cloud impossible :', msg);
      if(/permission/i.test(msg)){ toast('Accès à la base refusé — vérifiez les règles Firebase'); }
      const cached = localStorage.getItem('mo_db_cache');
      if(cached){ try{ DB = JSON.parse(cached); ensureDefaults(); return; }catch(_){} }
      DB = seedDB(); ensureDefaults();
      return; /* base locale uniquement, pas de saveDB vers le cloud */
    }
  }
  if(raw){
    DB = JSON.parse(raw);
    ensureDefaults();
    try{ localStorage.setItem('mo_db_cache', raw); }catch(_){}
    return;
  }
  /* Premier lancement réel : la clé n'existe pas encore dans le cloud. */
  DB = seedDB();
  ensureDefaults();
  await saveDB();
}
async function saveDB(){
  try{
    const raw = JSON.stringify(DB);
    try{ localStorage.setItem('mo_db_cache', raw); }catch(_){}
    /* On n'attend PAS la confirmation du serveur : la Realtime Database
       applique l'écriture localement tout de suite et la transmet dès que
       possible. L'interface reste instantanée même avec un réseau lent. */
    window.storage.set('db', raw, true)
      .catch(e=>{ console.error('Erreur de sauvegarde', e); toast('Erreur de sauvegarde des données'); });
  }catch(e){ console.error('Erreur de sauvegarde', e); toast('Erreur de sauvegarde des données'); }
}

/* Enregistre l'entrée ou la sortie. Sans action forcée : déduit
   automatiquement (1er pointage du jour = entrée, 2e = sortie). Avec une
   action forcée (choix explicite via la case à cocher du pointage par
   photo), c'est ce choix qui prime. */
async function registerPointage(user, methode, forcedAction){
  const today = todayStr();
  const heure = new Date().toLocaleTimeString('fr-FR');
  let p = DB.pointages.find(x=>x.userId===user.id && x.date===today);
  const action = forcedAction || (!p ? 'Entrée' : (!p.sortie ? 'Sortie' : null));
  if(action===null){
    ptMsg('err', `${user.prenom} ${user.nom} a déjà pointé l'entrée (${p.entree}) et la sortie (${p.sortie}) aujourd'hui.`);
    return;
  }
  if(!p){
    p = { id: uid('PT'), userId: user.id, date: today, entree: null, sortie: null, methodeIn: null, methodeOut: null };
    DB.pointages.push(p);
  }
  if(action==='Entrée'){
    p.entree = heure; p.methodeIn = methode;
    ptMsg('ok', `✅ <b>Entrée enregistrée</b><br>${escapeHtml(user.prenom+' '+user.nom)} (${user.code})<br>${today} à <b>${heure}</b>`);
  } else {
    p.sortie = heure; p.methodeOut = methode;
    ptMsg('ok', `✅ <b>Sortie enregistrée</b><br>${escapeHtml(user.prenom+' '+user.nom)} (${user.code})<br>Entrée : ${p.entree||'—'} — Sortie : <b>${heure}</b>`);
  }
  const prev = SESSION; SESSION = user;
  logAction('Pointage', action+' par '+methode);
  SESSION = prev;
  await saveDB();
}
function togglePtPhotoGrid(){
  const panel = document.getElementById('ptPhotoPanel');
  const show = panel.style.display==='none';
  panel.style.display = show ? 'block' : 'none';
  document.getElementById('ptPhotoToggleBtn').textContent = show ? '👥 Masquer les photos' : '👥 Pointer en touchant sa photo';
  if(show) renderPtPhotoGrid();
  else closePtConfirm();
}
function renderPtPhotoGrid(){
  closePtConfirm();
  const grid = document.getElementById('ptPhotoGrid');
  if(!grid) return;
  const today = todayStr();
  const sortMode = document.getElementById('ptSort')?.value || 'nom';
  let staff = DB.users.filter(u=>u.active);
  const statutOf = u=>{
    const p = DB.pointages.find(x=>x.userId===u.id && x.date===today);
    if(!p) return 'absent';
    return p.sortie ? 'sorti' : 'present';
  };
  if(sortMode==='nom') staff.sort((a,b)=>(a.prenom+a.nom).localeCompare(b.prenom+b.nom));
  else if(sortMode==='role') staff.sort((a,b)=> roleOrder(a.role)-roleOrder(b.role) || a.prenom.localeCompare(b.prenom));
  else if(sortMode==='statut'){
    const ordre = {present:0, absent:1, sorti:2};
    staff.sort((a,b)=> ordre[statutOf(a)]-ordre[statutOf(b)] || a.prenom.localeCompare(b.prenom));
  }
  grid.innerHTML = staff.map(u=>{
    const st = statutOf(u);
    return `<button type="button" class="pt-photo-tile ${st}" onclick="selectPointagePhoto('${u.id}')" title="${escapeHtml(u.prenom+' '+u.nom)}">
      <img src="${u.photo || defaultAvatar()}">
      <span class="pt-tile-dot"></span>
      <span class="pt-tile-name">${escapeHtml(u.prenom)}</span>
    </button>`;
  }).join('') || '<div class="muted" style="grid-column:1/-1;text-align:center;padding:10px;font-size:12px;">Aucun membre actif.</div>';
}
function roleOrder(r){ return {responsable_zone:0, superviseur:1, gerant:2, agent:3}[r] ?? 9; }
/* Étape 2 : après avoir touché sa photo — si c'est son premier pointage du
   jour, la carte de mot de passe s'affiche directement (action = Entrée).
   Si un pointage existe déjà pour aujourd'hui, une case à cocher permet de
   choisir explicitement Entrée ou Sortie avant de demander le mot de passe. */
function selectPointagePhoto(userId){
  const u = DB.users.find(x=>x.id===userId && x.active);
  if(!u) return;
  const today = todayStr();
  const p = DB.pointages.find(x=>x.userId===u.id && x.date===today);

  if(p && p.sortie){

  }

  if(!p){
    renderPtPasswordCard(u, 'Entrée');

function renderPtChoiceCard(u){

function confirmPtChoice(userId){

/* Carte finale : uniquement le mot de passe pour confirmer l'action choisie */
function renderPtPasswordCard(u, action){
  window._ptConfirmAction = action;
  const zone = document.getElementById('ptConfirmZone');
  zone.style.display='block';
  zone.innerHTML = `<div class="pt-confirm-card">
    <img src="${u.photo || defaultAvatar()}">
    <div class="pt-confirm-name">${escapeHtml(u.prenom+' '+u.nom)}</div>
    <div class="pt-confirm-action">Confirmez votre <b>${action==='Entrée'?'arrivée':'sortie'}</b> avec votre mot de passe</div>
    <input type="text" id="ptConfirmCode" placeholder="Votre mot de passe" autocomplete="off" autocapitalize="off" onkeydown="if(event.key==='Enter')validerPointagePhoto('${action}')">
    <div class="pt-confirm-err" id="ptConfirmErr"></div>
    <div class="pt-confirm-row">
      <button class="btn btn-ghost" onclick="closePtConfirm()">Annuler</button>

function closePtConfirm(){
  window._ptConfirmUserId = null;
  window._ptConfirmAction = null;
  const zone = document.getElementById('ptConfirmZone');
  zone.style.display='none'; zone.innerHTML='';

async function validerPointagePhoto(action){
  const u = DB.users.find(x=>x.id===window._ptConfirmUserId && x.active);
  const codeSaisi = (document.getElementById('ptConfirmCode')?.value || '').trim();
  if(!u){ closePtConfirm(); return; }
  const err = document.getElementById('ptConfirmErr');
  if(!codeSaisi){ err.textContent = 'Saisissez votre mot de passe.'; return; }
  const attendu = u.codePointage || u.pass;
  if(codeSaisi.toLowerCase() !== String(attendu).toLowerCase()){
    err.textContent = 'Mot de passe incorrect — pointage non validé.';
    return;
  }
  closePtConfirm();
  await registerPointage(u, 'photo', action);
  renderPtPhotoGrid();
}

/* ---------- Empreinte digitale (WebAuthn, liée à CET appareil) ----------
   Le responsable configure l'empreinte de chaque employé sur le téléphone
   de celui-ci. L'association empreinte ↔ employé est stockée sur l'appareil. */
function getDeviceCreds(){
  try{ return JSON.parse(localStorage.getItem('mo_empreintes')||'[]'); }catch(_){ return []; }
}
function setDeviceCreds(list){
  try{ localStorage.setItem('mo_empreintes', JSON.stringify(list)); }catch(_){}
}
function b64url(buf){
  return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64urlToBuf(s){
  s = s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='=';
  const bin = atob(s); const buf = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
  return buf.buffer;
}
async function openConfigEmpreinte(){
  if(!window.PublicKeyCredential){ ptMsg('err',"Ce navigateur ne prend pas en charge l'empreinte digitale."); return; }
  /* Autorisation du responsable de zone requise */
  const codeRZ = prompt('Configuration réservée au responsable de zone.\nCode d\'accès du responsable :');
  if(codeRZ===null) return;
  const passRZ = prompt('Mot de passe du responsable :');
  if(passRZ===null) return;
  const rz = findUser(codeRZ, passRZ);
  if(!rz || rz.role!=='responsable_zone'){ ptMsg('err','Identifiants du responsable invalides.'); return; }
  const staff = DB.users.filter(u=>u.active && u.role!=='responsable_zone');
  if(staff.length===0){ ptMsg('err','Aucun employé actif à configurer.'); return; }
  const choix = prompt('Code de l\'employé dont l\'empreinte sera enregistrée sur CET appareil :\n'+
    staff.map(u=>`${u.code} — ${u.prenom} ${u.nom} (${roleLabel(u.role)})`).join('\n'));
  if(choix===null) return;
  const emp = staff.find(u=>u.code.toLowerCase()===choix.trim().toLowerCase());
  if(!emp){ ptMsg('err','Code employé introuvable.'); return; }
  try{
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    const cred = await navigator.credentials.create({ publicKey:{
      challenge,
      rp: { name: 'Pointage '+(DB.settings.nomZone||'Eight Huit') },
      user: { id: new TextEncoder().encode(emp.id), name: emp.code, displayName: emp.prenom+' '+emp.nom },
      pubKeyCredParams: [{type:'public-key', alg:-7},{type:'public-key', alg:-257}],
      authenticatorSelection: { authenticatorAttachment:'platform', userVerification:'required' },
      timeout: 60000
    }});
    const creds = getDeviceCreds().filter(c=>c.userId!==emp.id);
    creds.push({ credId: b64url(cred.rawId), userId: emp.id });
    setDeviceCreds(creds);
    ptMsg('ok', `✅ Empreinte de <b>${escapeHtml(emp.prenom+' '+emp.nom)}</b> enregistrée sur cet appareil.<br>Il peut désormais pointer d'un simple doigt.`);
    document.getElementById('ptFingerBtn').style.display='block';
    document.getElementById('ptSep').style.display='block';
    const prev = SESSION; SESSION = rz;
    logAction('Empreinte configurée', emp.code+' sur appareil de pointage');
    SESSION = prev; await saveDB();
  }catch(e){
    console.warn(e);
    ptMsg('err',"Enregistrement de l'empreinte annulé ou refusé par l'appareil.");
  }
}
async function pointerParEmpreinte(){
  const creds = getDeviceCreds();
  if(creds.length===0){ ptMsg('err','Aucune empreinte configurée sur cet appareil.'); return; }
  try{
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    const assertion = await navigator.credentials.get({ publicKey:{
      challenge,
      allowCredentials: creds.map(c=>({ type:'public-key', id: b64urlToBuf(c.credId) })),
      userVerification:'required', timeout: 60000
    }});
    const match = creds.find(c=>c.credId===b64url(assertion.rawId));
    const user = match ? DB.users.find(u=>u.id===match.userId && u.active) : null;
    if(!user){ ptMsg('err','Empreinte reconnue mais employé introuvable ou suspendu.'); return; }
    await registerPointage(user, 'empreinte');
  }catch(e){
    console.warn(e);
    ptMsg('err','Empreinte non reconnue ou lecture annulée.');
  }
}

/* Le code de pointage EST le mot de passe : les deux sont désormais toujours
   identiques et se mettent à jour ensemble. Ce bouton change donc le mot de
   passe (et le code de pointage suit automatiquement). */
async function definirCodePointage(userId){
  const u = DB.users.find(x=>x.id===userId);
  if(!u) return;
  const nouveau = prompt(`Nouveau mot de passe de ${u.prenom} ${u.nom} — sera aussi son code de pointage :`, '');
  if(nouveau===null) return;
  const clean = nouveau.trim();
  if(!clean){ toast('Le mot de passe / code de pointage ne peut pas être vide'); return; }
  u.pass = clean;
  u.codePointage = clean;
  logAction('Mot de passe / code de pointage', u.code+' : mis à jour');
  await saveDB();
  toast('Mot de passe et code de pointage mis à jour');
  render();
}
/* Aligne le code de pointage sur le mot de passe pour tout le monde
   (utile pour les comptes créés avant l'activation de cette liaison). */
async function genererCodesPointage(){
  let n = 0;
  DB.users.forEach(u=>{
    if(u.codePointage === u.pass) return;
    u.codePointage = u.pass; n++;
  });
  if(n===0){ toast('Tous les codes de pointage sont déjà à jour'); return; }
  logAction('Codes de pointage synchronisés', n+' compte(s)');
  await saveDB();
  toast(n+' code(s) de pointage aligné(s) sur le mot de passe');
  render();
}

/* ---------- ANTI DOUBLE-CLIC ----------
   Un seul clic suffit : dès qu'un bouton d'action est cliqué, il est
   verrouillé un court instant. Les clics répétés (double-clic, appui long)
   sont ignorés — plus de doublons dans l'historique ni dans les données. */
document.addEventListener('click', function(e){
  const b = e.target.closest('button.btn-primary, button.btn-danger');
  if(!b) return;
  if(b.dataset.lock){ e.stopImmediatePropagation(); e.preventDefault(); return; }
  b.dataset.lock = '1';
  b.style.opacity = '.65';
  setTimeout(()=>{ delete b.dataset.lock; b.style.opacity=''; }, 800);
}, true);

function findUser(code, pass){
  return DB.users.find(u => u.code.toLowerCase() === code.trim().toLowerCase() && u.pass === (pass||'').trim() && u.active);
}

async function doLogin(){
  const code = document.getElementById('loginCode').value;
  const pass = document.getElementById('loginPass').value;
  const errBox = document.getElementById('loginErr');
  const u = findUser(code, pass);
  if(!u){
    errBox.style.display='block';
    errBox.textContent = 'Code d\'accès ou mot de passe invalide.';
    return;
  }
  errBox.style.display='none';
  u.lastLogin = nowISO();
  logAction('Connexion', `${u.role} connecté`);
  await saveDB();
  /* Connexion mémorisée sur cet ordinateur : la prochaine ouverture de
     l'application entre directement, sans redemander les identifiants. */
  try{ localStorage.setItem('mo_auto_session', u.id); }catch(_){}
  enterApp(u);
}

  logAction('Déconnexion','');
  saveDB();
  /* La déconnexion explicite efface la mémorisation : il faudra se
     reconnecter avec ses identifiants sur cet appareil. */
  try{ localStorage.removeItem('mo_auto_session'); }catch(_){}

/* ---------- Panneaux repliables ----------
   Un bouton ▾ est ajouté sur chaque panneau ; cliquer dessus (ou sur toute
   la tête du panneau, hors boutons et champs) replie / déplie le contenu. */
function initPanelFolding(){
  document.querySelectorAll('.panel, .tabgroup').forEach(p=>{
    const head = Array.from(p.children).find(c=>c.classList && (c.classList.contains('panel-head')||c.classList.contains('tabgroup-head')));
    if(!head || head.dataset.foldReady) return;
    head.dataset.foldReady = '1';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'fold-btn';
    btn.title = 'Replier / déplier';
    btn.textContent = '▾';
    head.appendChild(btn);
    const sync = ()=>{ btn.textContent = p.classList.contains('folded') ? '▸' : '▾'; };
    const toggle = ()=>{ p.classList.toggle('folded'); sync(); };
    btn.addEventListener('click', ev=>{ ev.stopPropagation(); toggle(); });
    head.addEventListener('click', ev=>{
      if(ev.target.closest('button, input, select, textarea, a, label')) return;
      toggle();
    });
    sync();
  });
}

    const trend = last14DaysSeries('ca', null, 30);

    const ymNow = todayStr().slice(0,7);
    const caMoisParGerant = gerants.map(g=>({nom:(g.prenom+' '+g.nom.charAt(0)+'.'), total: computeMonthTotal('ca', g.id, ymNow)}))
      .sort((a,b)=>b.total-a.total).slice(0,8);
    const omTrend = last14DaysSeries('om', null, 30);
    const simStats = [
      DB.sims.filter(s=>s.statut==='attribuee').length,
      DB.sims.filter(s=>s.statut==='stock').length,
      DB.sims.filter(s=>s.statut!=='attribuee' && s.statut!=='stock').length
    ];
    /* Taux d'atteinte des objectifs de la zone, ce mois-ci — jauges colorées façon infographie */
    const gaugeColors = {ca:'#FF6600', om:'#1F8A4C', sim:'#8E44AD'};
    const objGauges = OBJ_TYPES.map(t=>{
      const objectif = gerants.reduce((a,g)=>a+getObjectif(t,g.id,ymNow),0);
      const realise = gerants.reduce((a,g)=>a+computeMonthTotal(t,g.id,ymNow),0);
      const pct = objectif>0 ? (realise/objectif*100) : 0;
      return { label: typeFullLabel(t)+' ('+typeLabel(t)+')', pct, color: gaugeColors[t] };
    });
    extraHtml = `
      <div class="grid-2">
        <div class="panel"><div class="panel-head"><h2>🎯 Objectifs du mois — taux d'atteinte</h2></div>
          <div class="panel-body">${gaugeRow(objGauges)}</div></div>
        <div class="panel"><div class="panel-head"><h2>👥 Répartition du personnel</h2></div>
          <div class="panel-body">${miniBarRow([
            {label:'Superviseurs', value:superviseurs.length, max:Math.max(1,superviseurs.length,gerants.length,agents.length), color:'#E8A200'},
            {label:'Gérants', value:gerants.length, max:Math.max(1,superviseurs.length,gerants.length,agents.length), color:'#1F8A4C'},
            {label:'Agents', value:agents.length, max:Math.max(1,superviseurs.length,gerants.length,agents.length), color:'#FF6600'},
            {label:'PDV', value:DB.pdvs.length, max:Math.max(1,superviseurs.length,gerants.length,agents.length,DB.pdvs.length), color:'#8E44AD'},
          ])}</div></div>
      </div>
      <div class="grid-2">
        <div class="panel"><div class="panel-head"><h2>📈 Tendance du CA — 30 derniers jours</h2></div>
          <div class="panel-body"><div class="chart-wrap"><canvas id="dash_trend"></canvas></div></div></div>
        <div class="panel"><div class="panel-head"><h2>📈 Tendance OM — 30 derniers jours</h2></div>
          <div class="panel-body"><div class="chart-wrap"><canvas id="dash_om"></canvas></div></div></div>
      </div>
      <div class="grid-2">
        <div class="panel"><div class="panel-head"><h2>📊 CA du mois par gérant</h2></div>
          <div class="panel-body"><div class="chart-wrap">${caMoisParGerant.every(x=>x.total===0)? emptyState('Aucune donnée','Aucun CA déclaré ce mois-ci.') : '<canvas id="dash_gerants"></canvas>'}</div></div></div>
        <div class="panel"><div class="panel-head"><h2>🍩 Répartition des SIM</h2></div>
          <div class="panel-body"><div class="chart-wrap">${DB.sims.length===0? emptyState('Aucune SIM','—') : '<canvas id="dash_sims"></canvas>'}</div></div></div>
      </div>
      <div class="panel"><div class="panel-head"><h2>🏆 Top 5 gérants (CA cumulé)</h2></div>
        <div class="panel-body">
          ${ranked.length===0 ? emptyState('Aucune donnée','—') : ranked.map((r,i)=>`
            <div class="obj-row"><span>${i+1}. ${escapeHtml(r.g.prenom)} ${escapeHtml(r.g.nom)}</span><b>${r.total.toLocaleString('fr-FR')} GNF</b></div>
            <div class="progress-track"><div class="progress-fill" style="width:${ranked[0].total? Math.round(r.total/ranked[0].total*100):0}%;"></div></div>
          `).join('')}
        </div></div>
      ${alerts.length ? `<div class="panel"><div class="panel-head"><h2>⚠ Alertes réseau</h2>
          <button class="btn btn-ghost btn-sm" onclick="navigate('sims')">Voir les SIM</button></div>
          <div class="panel-body">
            <table><thead><tr><th>ICCID</th><th>Type</th><th>Détail</th></tr></thead><tbody>
            ${alerts.slice(0,5).map(a=>`<tr><td class="mono">${a.sim.iccid}</td><td>${a.type==='dormant'?'<span class="badge badge-warn">Stock dormant</span>':'<span class="badge badge-danger">Rotation anormale</span>'}</td><td class="muted">${escapeHtml(a.detail)}</td></tr>`).join('')}
            </tbody></table>
          </div></div>` : ''}
    `;
    afterRender = ()=>{
      drawChart('dash_trend','line', trend.labels, trend.data, '#FF6600', 'CA (GNF)');
      drawChart('dash_om','line', omTrend.labels, omTrend.data, '#1F8A4C', 'OM (GNF)');
      if(!caMoisParGerant.every(x=>x.total===0))
        drawChart('dash_gerants','bar', caMoisParGerant.map(x=>x.nom), caMoisParGerant.map(x=>x.total), '#D14E00', 'CA du mois');
      if(DB.sims.length)
        drawDoughnut('dash_sims', ['Attribuées','En stock','Autres'], simStats, ['#1F8A4C','#E8A200','#D92B2B'], 'SIM');
    };
  } else if(role==='superviseur'){
    const myGerants = DB.users.filter(u=>u.role==='gerant' && u.superviseurId===SESSION.id);
    const todayCA = DB.ca.filter(c=>isToday(c.date) && c.superviseurId===SESSION.id);
    const todayMoves = DB.activityLog.filter(l=> isToday(l.ts) && myGerants.some(g=>g.id===l.userId));
    statsHtml = cardsRow([
      ['Mes gérants', myGerants.length, myGerants.filter(g=>g.active).length+' actifs'],
      ["CA aujourd'hui", todayCA.reduce((a,c)=>a+Number(c.montant||0),0).toLocaleString('fr-FR')+' GNF', todayCA.length+' déclarations'],
      ['SIM déployées', DB.sims.filter(s=>s.deployedBy===SESSION.id).length, ''],
      ["Mouvements du jour", todayMoves.length, 'visibles jusqu\'à minuit'],
    ]);
    lockBanner = `<div class="lock-banner"><span class="banner-text">🔒 Accès limité au jour courant : les données d'hier et avant ne sont visibles que par le responsable de zone (rapports/justificatifs).</span>${dayArcSVG(38)}</div>`;
  } else if(role==='gerant'){
    const mine = DB.ca.filter(c=>c.gerantId===SESSION.id && isToday(c.date));
    const mineOM = DB.om.filter(c=>c.gerantId===SESSION.id && isToday(c.date));
    statsHtml = cardsRow([
      ["CA déclaré aujourd'hui", mine.reduce((a,c)=>a+Number(c.montant||0),0).toLocaleString('fr-FR')+' GNF', mine.length+' entrées'],
      ["OM déclaré aujourd'hui", mineOM.reduce((a,c)=>a+Number(c.montant||0),0).toLocaleString('fr-FR')+' GNF', mineOM.length+' entrées'],
      ['TDR aujourd\'hui', DB.tdr.filter(t=>t.gerantId===SESSION.id && isToday(t.date)).length, ''],
      ['LP aujourd\'hui', DB.lp.filter(t=>t.gerantId===SESSION.id && isToday(t.date)).length, ''],
    ]);
    const gTrend = last14DaysSeries('ca', SESSION.id, 14);
    extraHtml = `<div class="panel"><div class="panel-head"><h2>📈 Mon CA — 14 derniers jours</h2></div>
      <div class="panel-body"><div class="chart-wrap"><canvas id="dash_g_trend"></canvas></div></div></div>`;
    afterRender = ()=> drawChart('dash_g_trend','line', gTrend.labels, gTrend.data, '#FF6600', 'CA (GNF)');
  } else if(role==='agent'){
    const mySims = DB.sims.filter(s=>s.agentId===SESSION.id);
    statsHtml = cardsRow([
      ['SIM en charge', mySims.filter(s=>s.statut==='attribuee').length, ''],
      ['Historique total', mySims.length, 'SIM traitées'],
    ]);
  }

  main.innerHTML = `
    <div class="topbar">
      <div><h1>Tableau de bord</h1><p>Bienvenue, ${escapeHtml(SESSION.prenom)} ${escapeHtml(SESSION.nom)} — ${roleLabel(role)}</p></div>
    </div>
    ${lockBanner}
    ${statsHtml}
    ${extraHtml}
    <div class="panel">
      <div class="panel-head"><h2>Activité récente</h2></div>
      <div class="panel-body">${recentActivityTable()}</div>
    </div>
  `;
  afterRender();
}

function cardsRow(items){
  return `<div class="grid-cards">${items.map(([label,val,sub])=>`
    <div class="stat-card">
      <div class="stat-label">${label}</div>
      <div class="stat-value">${val}</div>
      ${sub?`<div class="stat-sub">${sub}</div>`:''}
    </div>`).join('')}</div>`;
}

function recentActivityTable(){
  let logs = [...DB.activityLog].sort((a,b)=> new Date(b.ts)-new Date(a.ts));
  if(SESSION.role==='superviseur'){
    // superviseur : uniquement logs du jour, de son équipe + lui-même
    const teamIds = DB.users.filter(u=>u.superviseurId===SESSION.id || u.createdBy===SESSION.id).map(u=>u.id).concat([SESSION.id]);
    logs = logs.filter(l=> isToday(l.ts) && teamIds.includes(l.userId));
  } else if(SESSION.role==='gerant' || SESSION.role==='agent'){
    logs = logs.filter(l=> l.userId===SESSION.id);
  }
  logs = logs.slice(0,12);
  if(logs.length===0) return emptyState('Aucune activité','Les actions effectuées apparaîtront ici.');
  return `<table><thead><tr><th>Date</th><th>Utilisateur</th><th>Rôle</th><th>Action</th><th>Détail</th></tr></thead><tbody>
    ${logs.map(l=>`<tr><td class="mono">${fmtDate(l.ts)}</td><td>${escapeHtml(l.userNom)}</td><td><span class="badge badge-orange">${roleLabel(l.role)}</span></td><td>${escapeHtml(l.action)}</td><td class="muted">${escapeHtml(l.details)}</td></tr>`).join('')}
  </tbody></table>`;
}

function emptyState(title,sub){
  return `<div class="empty"><b>${title}</b>${sub}</div>`;
}

async function addCustomTheme(){
  const nom = document.getElementById('ct_nom').value.trim();
  if(!nom){ toast('Donnez un nom au thème'); return; }
  const c1 = document.getElementById('ct_side1').value;
  const c2 = document.getElementById('ct_side2').value;
  const st = document.getElementById('ct_sidetext').value;
  const tb = document.getElementById('ct_top').value;
  const tt = document.getElementById('ct_toptext').value;
  const theme = {
    id: 'custom-' + Math.random().toString(36).slice(2,8),
    nom,
    bg: `linear-gradient(180deg, ${c1}, ${c2})`,
    text: st,
    textSoft: softColor(st),
    activeBg: 'rgba(0,0,0,.25)',
    topBg: `linear-gradient(90deg, ${tb}, ${tb})`,
    topText: tt,
    topSub: softColor(tt),
    btn: document.getElementById('ct_btn').value,
    btnDark: shadeColor(document.getElementById('ct_btn').value, -0.25)
  };
  if(!Array.isArray(DB.settings.customThemes)) DB.settings.customThemes = [];
  DB.settings.customThemes.push(theme);
  DB.settings.themeId = theme.id;
  applyTheme(theme.id);
  logAction('Thème personnalisé créé', nom);
  await saveDB();
  toast('Thème « '+nom+' » créé et appliqué');
  render();
}
async function deleteCustomTheme(themeId){
  if(!confirm('Supprimer ce thème personnalisé ?')) return;
  DB.settings.customThemes = (DB.settings.customThemes||[]).filter(t=>t.id!==themeId);
  if(DB.settings.themeId === themeId){ DB.settings.themeId = 'orange'; applyTheme('orange'); }
  logAction('Thème personnalisé supprimé', themeId);
  await saveDB();
  toast('Thème supprimé');
  render();
}

/* ---------- RÉINITIALISATION DES DONNÉES DE TRAVAIL ----------
   Utile après une période d'essai : remet à zéro les compteurs et
   mouvements enregistrés par les agents/gérants, sans supprimer les
   comptes ni les points de vente (qui se suppriment individuellement
   ailleurs dans Personnel / Points de vente). Réservé au responsable de
   zone, protégé par un mot de confirmation tapé manuellement. */
function settingsResetView(){
  if(SESSION.role!=='responsable_zone'){
    return `<div class="panel"><div class="panel-body">${emptyState('Accès réservé','Seul le responsable de zone peut réinitialiser les données.')}</div></div>`;
  }
  return `
    <div class="panel" style="border-color:#F0C9C9;">
      <div class="panel-head"><h2 style="color:var(--danger);">⚠ Réinitialiser les données de travail</h2></div>
      <div class="panel-body">
        <p class="muted" style="font-size:12.5px;margin:0 0 14px;line-height:1.6;">
          À utiliser si la base a servi pour un essai et que vous voulez repartir de zéro pour le vrai travail.
          Cette action remet à zéro les compteurs et mouvements cochés ci-dessous. Elle ne touche <b>ni les comptes du
          personnel, ni les points de vente</b> — pour les supprimer, utilisez les boutons 🗑 dans Personnel et Points de vente.
        </p>
        <div class="reset-check-list">
          <label class="reset-check"><input type="checkbox" id="rz_ca" checked> Déclarations CA, OM, TDR, TDA, LP</label>
          <label class="reset-check"><input type="checkbox" id="rz_obj" checked> Objectifs fixés (gérants et superviseurs)</label>
          <label class="reset-check"><input type="checkbox" id="rz_pointages" checked> Pointages du personnel (présences)</label>
          <label class="reset-check"><input type="checkbox" id="rz_sims"> Historique des SIM (remet chaque SIM « en stock », sans titulaire)</label>
          <label class="reset-check"><input type="checkbox" id="rz_reports"> Rapports générés</label>
          <label class="reset-check"><input type="checkbox" id="rz_log"> Journal d'audit</label>
        </div>
        <div class="field" style="margin-top:16px;">
          <label>Pour confirmer, tapez <b>REINITIALISER</b> ci-dessous</label>
          <input type="text" id="rz_confirm_word" placeholder="REINITIALISER" autocomplete="off">
        </div>
        <button class="btn btn-danger" style="width:100%;margin-top:4px;" onclick="executeReset()">Réinitialiser les données sélectionnées</button>
      </div>
    </div>`;
}
async function executeReset(){
  const word = (document.getElementById('rz_confirm_word').value||'').trim().toUpperCase();
  if(word !== 'REINITIALISER'){ toast('Tapez exactement REINITIALISER pour confirmer'); return; }
  const doCA = document.getElementById('rz_ca').checked;
  const doObj = document.getElementById('rz_obj').checked;
  const doPt = document.getElementById('rz_pointages').checked;
  const doSims = document.getElementById('rz_sims').checked;
  const doReports = document.getElementById('rz_reports').checked;
  const doLog = document.getElementById('rz_log').checked;
  if(!doCA && !doObj && !doPt && !doSims && !doReports && !doLog){ toast('Sélectionnez au moins un élément à réinitialiser'); return; }
  if(!confirm('Cette action est IRRÉVERSIBLE. Confirmez-vous la réinitialisation des données sélectionnées ?')) return;

  const resetParts = [];
  if(doCA){ DB.ca=[]; DB.om=[]; DB.tdr=[]; DB.tda=[]; DB.lp=[]; resetParts.push('déclarations CA/OM/TDR/TDA/LP'); }
  if(doObj){ DB.objectifs={}; DB.objectifsSup={}; resetParts.push('objectifs'); }
  if(doPt){ DB.pointages=[]; resetParts.push('pointages'); }
  if(doSims){ DB.sims.forEach(s=>{ s.statut='stock'; s.agentId=null; s.clientActuelId=null; s.history=[]; }); resetParts.push('historique des SIM'); }
  if(doReports){ DB.reports=[]; resetParts.push('rapports générés'); }
  if(doLog){ DB.activityLog=[]; resetParts.push("journal d'audit"); }

  logAction('Réinitialisation des données', resetParts.join(', '));
  await saveDB();
  toast('Réinitialisation effectuée : '+resetParts.join(', '));
  render();
}

function handlePhotoSelect(input, previewId){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => { document.getElementById(previewId).src = e.target.result; };
  reader.readAsDataURL(file);
}

function nextCode(prefix){
  const existing = DB.users.filter(u=>u.code.startsWith(prefix+'-')).map(u=>parseInt(u.code.split('-')[1])||0);
  const n = (existing.length? Math.max(...existing):0)+1;
  return prefix+'-'+String(n).padStart(4,'0');
}

  const photo = photoEl && photoEl.src.startsWith('data:image') && !photoEl.src.includes('svg+xml') ? photoEl.src : null;

  if(!prenom || !nom || !code || !pass){ toast('Veuillez remplir tous les champs obligatoires'); return; }
  if(DB.users.some(u=>u.code.toLowerCase()===code.toLowerCase())){ toast('Ce code existe déjà'); return; }

  const newUser = {
    id: uid(role.substring(0,2).toUpperCase()),
    role, code, pass, nom, prenom, tel, photo,
    codePointage: pass, /* le code de pointage suit toujours le mot de passe */
    pdvId: pdvId || null,
    superviseurId: superviseurId || null,
    gerantId: gerantId,
    createdAt: nowISO(), createdBy: SESSION.id, active:true,
    perms:{modifier:modif, supprimer:suppr}
  };
  DB.users.push(newUser);
  logAction('Création de compte', `${roleLabel(role)} ${prenom} ${nom} (${code}) créé`);
  await saveDB();
  closeModal();
  toast(`Compte créé : ${code} / ${pass}`);
  render();
}

async function savePermUser(id){
  const u = DB.users.find(x=>x.id===id);
  const newModif = document.getElementById('pu_modif').checked;
  const newSuppr = document.getElementById('pu_suppr').checked;
  if(!u.permsHistory) u.permsHistory = [];
  if(newModif!==u.perms.modifier || newSuppr!==u.perms.supprimer){
    u.permsHistory.push({
      ts: nowISO(), by: SESSION.prenom+' '+SESSION.nom,
      before: {modifier:u.perms.modifier, supprimer:u.perms.supprimer},
      after: {modifier:newModif, supprimer:newSuppr}
    });
  }
  u.perms.modifier = newModif;
  u.perms.supprimer = newSuppr;
  logAction('Autorisations modifiées', `${u.code} : modif=${u.perms.modifier}, suppr=${u.perms.supprimer}`);

  closeModal();
  toast('Autorisations mises à jour');

function accessTable(list){

function pdvGrid(list){

  return `<div class="pdv-grid">${list.map(p=>{
    const gerant = DB.users.find(u=>u.id===p.gerantId);

    const caTotal = gerant ? DB.ca.filter(c=>c.gerantId===gerant.id).reduce((a,c)=>a+Number(c.montant||0),0) : 0;
    return `<div class="pdv-card" onclick="openPDVProfile('${p.id}')">
      <div class="pdv-card-head">
        <div class="pdv-card-name">${escapeHtml(p.nom)}</div>

      </div>

        <div><span class="pdv-stat-val">${simCount}</span><span class="pdv-stat-lab">SIM</span></div>
        <div><span class="pdv-stat-val">${caTotal.toLocaleString('fr-FR')}</span><span class="pdv-stat-lab">GNF cumulés</span></div>
      </div>
    </div>`;
  }).join('')}</div>`;
}

function filterPdvGrid(){
  const q = document.getElementById('pdvSearch').value.toLowerCase();
  const list = DB.pdvs.filter(p=>{
    const gerant = DB.users.find(u=>u.id===p.gerantId);
    const hay = [p.nom, p.lieu, gerant?gerant.prenom+' '+gerant.nom:''].join(' ').toLowerCase();
    return hay.includes(q);
  });
  document.getElementById('pdvGridWrap').innerHTML = pdvGrid(list);
}

async function deletePDV(id){
  const p = DB.pdvs.find(x=>x.id===id);
  if(!p) return;
  const nbSims = DB.sims.filter(s=>s.pdvId===id).length;
  if(!confirm(`Supprimer le point de vente « ${p.nom} » ?${nbSims? `\n${nbSims} SIM y sont rattachées : elles seront détachées de ce PDV (leur historique est conservé).`:''}`)) return;
  DB.pdvs = DB.pdvs.filter(x=>x.id!==id);
  DB.sims.forEach(s=>{ if(s.pdvId===id) s.pdvId = null; });
  DB.users.forEach(u=>{ if(u.pdvId===id) u.pdvId = null; });
  logAction('Suppression PDV', p.nom);
  await saveDB();
  closeModal();
  toast('Point de vente supprimé');
  render();
}

/* ---------- ALERTES SIM ----------
   - Stock dormant : SIM en stock depuis plus de 15 jours sans attribution
   - Mouvements suspects : SIM ayant subi 3 retraits ou plus (rotation anormale) */
function simAlerts(){
  const alerts = [];
  const now = new Date();
  DB.sims.forEach(s=>{
    if(s.statut==='stock'){
      const lastEvent = s.history[s.history.length-1];
      const days = lastEvent ? Math.floor((now - new Date(lastEvent.ts))/86400000) : 0;
      if(days >= 15) alerts.push({sim:s, type:'dormant', detail:`En stock depuis ${days} jours sans attribution`});
    }
    const retraits = s.history.filter(h=>h.event==='Retrait').length;
    if(retraits >= 3) alerts.push({sim:s, type:'rotation', detail:`${retraits} retraits enregistrés — rotation anormale`});
  });
  return alerts;
}

function filterSimsTable(){
  const q = (document.getElementById('simSearch')?.value || '').toLowerCase();
  const statusF = document.getElementById('simStatusFilter')?.value || '';
  const pdvF = document.getElementById('simPdvFilter')?.value || '';
  let list = DB.sims;
  if(SESSION.role==='agent') list = list.filter(s=>s.agentId===SESSION.id);
  list = list.filter(s=>{
    const agent = DB.users.find(u=>u.id===s.agentId);
    const hay = [s.iccid, s.clientNomActuel, s.clientTelActuel, agent?agent.prenom+' '+agent.nom:''].join(' ').toLowerCase();
    if(q && !hay.includes(q)) return false;
    if(statusF && s.statut!==statusF) return false;
    if(pdvF && s.pdvId!==pdvF) return false;
    return true;
  });
  document.getElementById('simsTableWrap').innerHTML = simsTable(list);
}

    const hist = s.history.map(h=>`${fmtDate(h.ts)} | ${h.event} | ${h.details}`).join('  //  ');
    rows.push([s.iccid, s.statut, s.clientNomActuel||'—', s.clientTelActuel||'—', agent?agent.prenom+' '+agent.nom:'—', pdv?pdv.nom:'—', hist]);
